<style>
:root {
  --paper:#f8f8f6; --panel:#ffffff; --ink:#181b20; --muted:#5b5e66; --faint:#8a8d95;
  --rule:#e3e3df; --rule-strong:#c9c9c4; --favor:#2a78d6; --harsh:#e34948; --neutral-mid:#f0efec;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#141513; --panel:#1a1a19; --ink:#f2f1ec; --muted:#b0b0a8; --faint:#7d7d77;
    --rule:#32322f; --rule-strong:#4a4a46; --favor:#3987e5; --harsh:#e66767; --neutral-mid:#383835;
  }
}
:root[data-theme="dark"] {
  --paper:#141513; --panel:#1a1a19; --ink:#f2f1ec; --muted:#b0b0a8; --faint:#7d7d77;
  --rule:#32322f; --rule-strong:#4a4a46; --favor:#3987e5; --harsh:#e66767; --neutral-mid:#383835;
}
* { box-sizing:border-box; }
body { background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans',system-ui,sans-serif; margin:0; line-height:1.6; }
#gate { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
.card { background:var(--panel); border:1px solid var(--rule); border-top:3px double var(--rule-strong);
  max-width:26rem; width:100%; padding:2.25rem 2rem; }
.eyebrow { font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted); margin:0 0 .75rem; }
h1 { font-family:'Spectral',Georgia,serif; font-weight:700; font-size:1.6rem; line-height:1.2; margin:0 0 .5rem; text-wrap:balance; }
.card p { color:var(--muted); font-size:.9rem; margin:.25rem 0 1.25rem; }
form { display:flex; gap:.5rem; }
input[type=password] { flex:1; font-family:'IBM Plex Mono',monospace; font-size:1rem; letter-spacing:.15em;
  padding:.55rem .75rem; border:1px solid var(--rule-strong); border-radius:4px;
  background:var(--paper); color:var(--ink); min-width:0; }
input[type=password]:focus-visible { outline:2px solid var(--favor); outline-offset:1px; }
button { font-family:'IBM Plex Sans',system-ui,sans-serif; font-weight:500; font-size:.9rem;
  padding:.55rem 1.1rem; border:none; border-radius:4px; background:var(--favor); color:#fff; cursor:pointer; }
button:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
button[disabled] { opacity:.6; cursor:wait; }
#err { color:var(--harsh); font-size:.85rem; min-height:1.3em; margin:.6rem 0 0; }
#report { display:none; }
</style>

<script>
(function () {
  var vault = JSON.parse(document.getElementById('vault').textContent);
  var b = function (s) { var raw = atob(s), a = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i); return a; };
  function unlock(pw) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function (km) { return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b(vault.salt), iterations: 300000, hash: 'SHA-256' },
        km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']); })
      .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(vault.iv) }, key, b(vault.ct)); })
      .then(function (plain) { return new TextDecoder().decode(plain); });
  }
  function show(html) {
    var r = document.getElementById('report');
    r.innerHTML = html;
    document.getElementById('gate').style.display = 'none';
    r.style.display = 'block';
  }
  var form = document.getElementById('f'), pwEl = document.getElementById('pw'),
      go = document.getElementById('go'), err = document.getElementById('err');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    err.textContent = '';
    go.disabled = true;
    unlock(pwEl.value).then(function (html) {
      try { sessionStorage.setItem('n26audit', pwEl.value); } catch (_) {}
      show(html);
    }).catch(function () {
      go.disabled = false;
      err.textContent = 'Wrong password. Try again.';
      pwEl.select();
    });
  });
  try {
    var saved = sessionStorage.getItem('n26audit');
    if (saved) unlock(saved).then(show).catch(function () {});
  } catch (_) {}
})();
</script>
