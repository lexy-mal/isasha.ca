                const coupleCount = isCoupleEvent ? Math.ceil(competitors.length / 2) : null;
                const countText = isCoupleEvent
                    ? `${coupleCount} couple${coupleCount !== 1 ? 's' : ''}`
                    : `${competitors.length} competitor${competitors.length !== 1 ? 's' : ''}`;

                const eventLevelChip = getLevelChipHtml(info.event);
                const eventAgeChip = getAgeChipHtml(info.event);
                const eventChipsRow = (eventLevelChip || eventAgeChip)
                    ? `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px;">${eventLevelChip}${eventAgeChip}</div>`
                    : '';
                const awardsSummary = displayAwards ? ` | Awards ${displayAwards}` : '';

                html += `
                    <div class="event-summary" style="font-size: 0.9em; color: var(--text-secondary); margin-top: 8px;">
                        <div class="event-summary-name">${info.event}${placementBadge}</div>
                        ${eventChipsRow}
                        ${partner ? `<strong style="color: var(--accent);">${partner}</strong> | ` : ''}${displayTime}${awardsSummary} | ${countText}
                    </div>
                `;

                // Expanded view (hidden by default)
                html += `<div class="event-meta" style="display: none;">`;
                html += `
                    <div class="meta-field">
                        <div class="meta-label">Time</div>
                        <div class="meta-value">${displayTime}</div>
                    </div>
                    ${displayAwards ? `
                    <div class="meta-field">
                        <div class="meta-label">Awards</div>
                        <div class="meta-value">${displayAwards}</div>
                    </div>` : ''}
                    <div class="meta-field">
                        <div class="meta-label">Competitors</div>
                        <div class="meta-value">${competitors.length} total</div>
                    </div>
                `;
                html += buildHeatRanking(info.heat, info.event);
                html += buildJudgeBreakdown(info.heat, info.event, name);
                html += `</div>`;

                html += `<div class="event-details" style="display: none;">`;

                if (competitors.length === 1) {
                    html += `<div class="solo-badge">✓ Solo performance</div>`;
                } else if (isCoupleEvent && partner) {
                    // Couple event with partner
                    html += `
                        <div class="partner-section">
                            <div class="partner-label">Dancing with</div>
                            <div class="partner-name">${eventPartners.join(' & ')}</div>
                        </div>
                    `;

                    // Show other competitors as couples (excluding self and own partners)
                    const otherCompetitors = competitors.filter(c => c !== name && !eventPartners.includes(c));

                    if (otherCompetitors.length > 0) {
                        html += `<div class="competitors-title">Other Competitors</div>`;
                        html += `<div class="couples-grid">`;

                        // Group competitors into couples by checking their partner info.
                        // A dancer can have several partners across dances, so the scraped
                        // partner field may name someone who is not in this event. Pair on
                        // mutual claims first, then one-sided ones, so nobody is rendered
                        // solo before another competitor claims them as a partner.
                        const partnerInEvent = competitor => {
                            const competitorEntry = participantsData[competitor]?.entries.find(
                                e => e.heat === info.heat && e.event === info.event
                            );
                            const claimed = competitorEntry?.partner;
                            return claimed && otherCompetitors.includes(claimed) ? claimed : null;
                        };

                        const processedCompetitors = new Set();
                        const units = [];

                        const pairUp = mutualOnly => {
                            otherCompetitors.forEach(competitor => {
                                if (processedCompetitors.has(competitor)) return;

                                const competitorPartner = partnerInEvent(competitor);
                                if (!competitorPartner || processedCompetitors.has(competitorPartner)) return;
                                if (mutualOnly && partnerInEvent(competitorPartner) !== competitor) return;

                                units.push({ sortKey: competitor, members: [competitor, competitorPartner] });
                                processedCompetitors.add(competitor);
                                processedCompetitors.add(competitorPartner);
                            });
                        };

                        pairUp(true);
                        pairUp(false);

                        otherCompetitors.forEach(competitor => {
                            if (processedCompetitors.has(competitor)) return;
                            units.push({ sortKey: competitor, members: [competitor] });
                            processedCompetitors.add(competitor);
                        });

                        units.sort((a, b) => a.sortKey.localeCompare(b.sortKey));

                        units.forEach(unit => {
                            html += `<div class="couple-pair">`;
                            html += unit.members
                                .map(m => `<span class="couple-name" onclick="searchAndSelect('${onclickArg(m)}')">${m}</span>`)
                                .join(`<span class="couple-separator"> & </span>`);
                            html += `</div>`;
                        });

                        html += `</div>`;
                    }
                } else {
                    // Solo event or non-couple event
                    html += `<div class="competitors-title">👥 ${competitors.length > 1 ? 'Competing with' : 'Solo event'}</div>`;
                    html += `<div class="competitors-list">`;

                    if (competitors.length === 1) {
                        html += `<div class="solo-badge">✓ Solo performance</div>`;
                    } else {
                        competitors.forEach(competitor => {
                            if (competitor !== name) {
                                const isPartner = info.entries.some(e => e.partner === competitor);
                                const badgeClass = isPartner ? 'badge-partner' : 'badge-opponent';
                                const roleText = isPartner ? 'Partner' : 'Opponent';

                                html += `
                                    <div class="competitor">
                                        <span class="competitor-name" onclick="searchAndSelect('${onclickArg(competitor)}')">${competitor}</span>
                                        <span class="role-badge ${badgeClass}">${roleText}</span>
                                    </div>
                                `;
                            }
                        });
                    }

                    html += `</div>`;
                }

                html += `</div>`;
                html += `</div>`;
            });

            html += '</div>';
            contentElement.innerHTML = html;
            updateDetailCountdown();
            if (document.querySelector('.detail-overlay')?.classList.contains('active')) {
                observeOverlayTop();
            }
        }

        const RESULT_FILTER_LABELS = { gold: '🥇 Gold', silver: '🥈 Silver', bronze: '🥉 Bronze', final: 'Finals', semi: 'Semis' };

        // Tap a gold/silver/bronze/finals/semis stat box to show only matching
        // events below; tap the same box again to clear the filter.
        function toggleResultFilter(boxEl, category) {
            const container = boxEl.closest('#contentDisplay, #detailContentDisplay');
            if (!container) return;

            const statusEl = container.querySelector('.result-filter-status');
            const items = container.querySelectorAll('.events-list > .event-item');
            const wasActive = boxEl.classList.contains('active');

            container.querySelectorAll('.stats-grid-results .stat-box').forEach(b => b.classList.remove('active'));

            if (wasActive) {
                items.forEach(item => { item.style.display = ''; });
                if (statusEl) statusEl.textContent = '';
                return;
            }

            boxEl.classList.add('active');
            let visibleCount = 0;
            items.forEach(item => {
                const cats = (item.dataset.result || '').split(' ');
                const match = cats.includes(category);
                item.style.display = match ? '' : 'none';
                if (match) visibleCount++;
            });

            if (statusEl) {
                statusEl.textContent = `Showing ${visibleCount} of ${items.length} events — ${RESULT_FILTER_LABELS[category] || category} (tap again to clear)`;
            }
        }

        function filterHeatsByOpponent(value, inputEl) {
            const query = value.trim().toLowerCase();
            const container = inputEl.closest('#contentDisplay, #detailContentDisplay');
            if (!container) return;

            const items = container.querySelectorAll('.events-list > .event-item');
            let visibleCount = 0;

            items.forEach(item => {
                const competitors = item.dataset.competitors || '';
                const match = !query || competitors.includes(query);
                item.style.display = match ? '' : 'none';
                if (match) visibleCount++;
            });

            const countEl = container.querySelector('.opponent-filter-count');
            if (countEl) {
                countEl.textContent = query ? `${visibleCount} of ${items.length} heats shown` : '';
            }

            renderOpponentSuggestions(query, inputEl);
        }

        function renderOpponentSuggestions(query, inputEl) {
            const suggestionsEl = inputEl.parentElement.querySelector('.opponent-filter-suggestions');
            if (!suggestionsEl) return;

            if (!query) {
                suggestionsEl.style.display = 'none';
                suggestionsEl.innerHTML = '';
                return;
            }

            const allOpponents = (inputEl.dataset.allOpponents || '').split('|').filter(Boolean);
            const matches = allOpponents.filter(o => o.toLowerCase().includes(query)).sort();

            if (matches.length === 0) {
                suggestionsEl.innerHTML = `<div class="opponent-suggestion-empty">No opponents match "${query}"</div>`;
                suggestionsEl.style.display = 'block';
                return;
            }

            suggestionsEl.innerHTML = matches.map(o =>
                `<div class="opponent-suggestion-item" onmousedown="selectOpponentSuggestion('${o.replace(/'/g, "\\'")}', this)">${o}</div>`
            ).join('');
            suggestionsEl.style.display = 'block';
        }

        function selectOpponentSuggestion(name, el) {
            const suggestionsEl = el.closest('.opponent-filter-suggestions');
            const inputEl = suggestionsEl.parentElement.querySelector('.opponent-filter-input');
            inputEl.value = name;
            filterHeatsByOpponent(name, inputEl);
            suggestionsEl.style.display = 'none';
        }

        function hideOpponentSuggestions(inputEl) {
            setTimeout(() => {
                const suggestionsEl = inputEl.parentElement.querySelector('.opponent-filter-suggestions');
                if (suggestionsEl) suggestionsEl.style.display = 'none';
            }, 150);
        }

        // Pass the element that fired the event: on mobile the person detail renders
        // into #detailContentDisplay while #contentDisplay stays in the DOM but empty,
        // so the container has to be found from the control the user touched.
        function filterEventsByNameAndOpponents(sourceEl) {
            const container = sourceEl
                ? sourceEl.closest('#contentDisplay, #detailContentDisplay')
                : document.querySelector('.detail-overlay.active #detailContentDisplay') || document.getElementById('contentDisplay');
            if (!container) return;

            const nameInput = container.querySelector('.event-filter-input');
            const minSlider = container.querySelector('.event-opponents-filter-min');
            const maxSlider = container.querySelector('.event-opponents-filter-max');

            if (!nameInput || !minSlider || !maxSlider) return;

            const nameValue = (nameInput.value || '').trim().toLowerCase();
            let minValue = parseInt(minSlider.value || 1);
            let maxValue = parseInt(maxSlider.value || 50);

            // Ensure min doesn't exceed max and vice versa
            if (minValue > maxValue) {
                [minValue, maxValue] = [maxValue, minValue];
                minSlider.value = minValue;
                maxSlider.value = maxValue;
            }

            const eventItems = container.querySelectorAll('.events-list > .event-item');
            let visibleCount = 0;

            eventItems.forEach(item => {
                // Check name filter
                const eventTitle = item.querySelector('.event-title');
                const eventName = eventTitle ? eventTitle.textContent.toLowerCase() : '';
                const nameMatch = !nameValue || eventName.includes(nameValue);

                // Check participant count range
                const competitors = item.dataset.competitors || '';
                const competitorCount = competitors ? competitors.split('|').filter(Boolean).length : 0;
                const countMatch = competitorCount >= minValue && competitorCount <= maxValue;

                const match = nameMatch && countMatch;
                item.style.display = match ? '' : 'none';
                if (match) visibleCount++;
            });

            // Update range display
            const valueEl = container.querySelector('.opponents-filter-value');
            if (valueEl) {
                valueEl.textContent = `${minValue}-${maxValue}`;
            }

            const countEl = container.querySelector('.event-filter-count');
            if (countEl) {
                const filters = [];
                if (nameValue) filters.push(`name: "${nameValue}"`);
                filters.push(`participants: ${minValue}-${maxValue}`);
                countEl.textContent = `${visibleCount} of ${eventItems.length} events shown (${filters.join(', ')})`;
            }
        }

        function searchAndSelect(name, source) {

                    const span = el.querySelector('span');

                        </div>

                        <input type="text" class="home-heats-participant-filter" placeholder="Participant..." style="width:100%;padding:6px 10px;background:var(--bg-secondary);border:1px solid var(--bg-tertiary);border-radius:3px;color:var(--text-primary);font-size:0.8em;margin-bottom:6px;" oninput="showParticipantSuggestions();filterHomeHeats()" onchange="filterHomeHeats()">

                        <input type="text" class="home-heats-event-filter" placeholder="Event (SOLO, BALLROOM...)..." style="width:100%;padding:6px 10px;background:var(--bg-secondary);border:1px solid var(--bg-tertiary);border-radius:3px;color:var(--text-primary);font-size:0.8em;margin-bottom:6px;" oninput="filterHomeHeats()" onchange="filterHomeHeats()">

                        ${buildFacetControlHtml('age', allHeats, 'Age category parsed from the event code — see com_assets/AGE_CATEGORIES.md for how codes like AD1-AD5 were estimated.')}
                        ${buildFacetControlHtml('style', allHeats, 'Dance discipline (Ballroom, Latin, Smooth, Rhythm...)')}
                        ${buildFacetControlHtml('dance', allHeats, 'The specific dance named in the event')}
                        ${buildFacetControlHtml('level', allHeats, 'Proficiency level — see com_assets/SKILL_LEVELS.md')}

                        <select class="home-heats-sort" style="width:100%;padding:6px 10px;background:var(--bg-secondary);border:1px solid var(--bg-tertiary);border-radius:3px;color:var(--text-primary);font-size:0.8em;" onchange="filterHomeHeats()">
                            <option value="name_asc">Sort: Event Name (A-Z)</option>

        // Infinite scroll state for the home heats grid: filterHomeHeats() recomputes the

        let homeHeatsFilteredCache = [];
        let homeHeatsRenderedCount = 0;
        const HOME_HEATS_BATCH_SIZE = 30;

        function homeHeatCardHtml(heat) {

        function toggleFacetPanel(facetKey, evt) {
            evt.stopPropagation();
            const cfg = HOME_HEATS_FACETS[facetKey];
            const panel = document.getElementById(cfg.panelId);
            if (!panel) return;
            const opening = panel.style.display === 'none';
            panel.style.display = opening ? 'block' : 'none';
            if (opening) setupFacetOutsideClickListener(facetKey);
        }

        // Bound lazily (only while the panel is actually open) rather than once globally,
        // so a click anywhere on the page doesn't pay for a listener + querySelector on
        // every click for the entire life of the page.
        function setupFacetOutsideClickListener(facetKey) {
            const cfg = HOME_HEATS_FACETS[facetKey];
            const handler = (evt) => {
                const panel = document.getElementById(cfg.panelId);
                const btn = document.getElementById(cfg.btnId);
                if (!panel || panel.style.display === 'none') {
                    document.removeEventListener('click', handler);
                    return;
                }
                if (!panel.contains(evt.target) && evt.target !== btn) {
                    panel.style.display = 'none';
                    document.removeEventListener('click', handler);
                }
            };
            document.addEventListener('click', handler);
        }

        function getSelectedFacetCodes(facetKey) {
            const cfg = HOME_HEATS_FACETS[facetKey];
            return Array.from(document.querySelectorAll('.' + cfg.checkboxClass + ':checked')).map(cb => cb.value);
        }

        function onFacetFilterChange(facetKey) {
            updateFacetFilterLabel(facetKey);
            filterHomeHeats();
        }

        function updateFacetFilterLabel(facetKey) {
            const cfg = HOME_HEATS_FACETS[facetKey];
            const label = document.getElementById(cfg.labelId);
            if (!label) return;
            const checked = Array.from(document.querySelectorAll('.' + cfg.checkboxClass + ':checked'));
            if (checked.length === 0) {
                label.textContent = cfg.allLabel;
            } else if (checked.length === 1) {
                label.textContent = checked[0].value === '__none__'
                    ? cfg.noneShortLabel
                    : cfg.singleSelectText(checked[0].value, checked[0].dataset.label);
            } else {
                label.textContent = `${checked.length} ${cfg.pluralNoun} selected`;
            }
        }

        function clearFacetFilter(facetKey) {
            const cfg = HOME_HEATS_FACETS[facetKey];
            document.querySelectorAll('.' + cfg.checkboxClass + ':checked').forEach(cb => cb.checked = false);
            onFacetFilterChange(facetKey);
        }

        function updateHomeHeatsStatus() {
            const statusDiv = document.getElementById('home-heats-status');
            if (!statusDiv) return;
            const total = homeHeatsFilteredCache.length;
            if (total === 0) {
                statusDiv.textContent = '';
                return;
            }
            statusDiv.textContent = homeHeatsRenderedCount < total
                ? `Showing ${homeHeatsRenderedCount} of ${total} — scroll for more`
                : `Showing all ${total}`;
        }

        function filterHomeHeats() {
            const allHeats = JSON.parse(sessionStorage.getItem('allHomeHeats') || '[]');
            const participantFilter = document.querySelector('.home-heats-participant-filter')?.value.toLowerCase() || '';
            const eventFilter = document.querySelector('.home-heats-event-filter')?.value.toLowerCase() || '';
            const minCompetitors = parseInt(document.querySelector('.home-heats-competitors-min')?.value || '1');
            const maxCompetitors = parseInt(document.querySelector('.home-heats-competitors-max')?.value || '999');

            const rangeValue = document.querySelector('.home-heats-range-value');
            if (rangeValue) rangeValue.textContent = minCompetitors + '-' + maxCompetitors;

            // Each facet's own selections are OR'd together (e.g. Bronze OR Silver); the
            // facets themselves are AND'd (e.g. age AND dance style), so "15 & Under" +
            // "Latin" narrows to events matching both, not either.
            const selectedByFacet = Object.keys(HOME_HEATS_FACETS).map(facetKey => ({
                cfg: HOME_HEATS_FACETS[facetKey],
                codes: getSelectedFacetCodes(facetKey)
            }));

            let filtered = allHeats.filter(heat => {
                const competitorMatch = heat.competitors >= minCompetitors && heat.competitors <= maxCompetitors;
                const eventMatch = !eventFilter || heat.name.toLowerCase().includes(eventFilter);
                const participantMatch = !participantFilter || heat.competitorList.some(p => p.toLowerCase().includes(participantFilter));
                const facetsMatch = selectedByFacet.every(({ cfg, codes }) => {
                    if (codes.length === 0) return true;
                    const match = cfg.getMatch(heat.name);
                    return codes.some(code => code === '__none__' ? !match : match?.code === code);
                });
                return competitorMatch && eventMatch && participantMatch && facetsMatch;
            });

            const sortBy = document.querySelector('.home-heats-sort')?.value || 'name_asc';
            filtered.sort((a, b) => compareHeatsBySort(a, b, sortBy));

            homeHeatsFilteredCache = filtered;
            homeHeatsRenderedCount = 0;

            const listDiv = document.getElementById('home-heats-list');
            if (listDiv) listDiv.innerHTML = '';

            if (filtered.length === 0) {
                if (listDiv) listDiv.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:var(--text-secondary);font-size:0.85em;padding:16px 0;">No heats found</div>`;
                updateHomeHeatsStatus();
                return;
            }

            renderMoreHomeHeats();
        }

        function renderMoreHomeHeats() {
            const listDiv = document.getElementById('home-heats-list');
            if (!listDiv) return;
            const nextBatch = homeHeatsFilteredCache.slice(homeHeatsRenderedCount, homeHeatsRenderedCount + HOME_HEATS_BATCH_SIZE);
            if (nextBatch.length === 0) return;
            listDiv.insertAdjacentHTML('beforeend', nextBatch.map(homeHeatCardHtml).join(''));
            homeHeatsRenderedCount += nextBatch.length;
            updateHomeHeatsStatus();
        }

        // The grid has no scroll container of its own (it just grows and the whole page
        // scrolls — a nested overflow-y:auto pane here was unreliable on iOS Safari, which
        // frequently won't hand touch-scroll gestures to a small scrollable box nested
        // inside a much taller page). A sentinel below the grid + IntersectionObserver
        // triggers loading the next batch regardless of what's actually doing the
        // scrolling, so this works the same on desktop and mobile.
        let homeHeatsObserver = null;

        function setupHomeHeatsObserver() {
            if (homeHeatsObserver) homeHeatsObserver.disconnect();
            const sentinel = document.getElementById('home-heats-sentinel');
            if (!sentinel) return;
            homeHeatsObserver = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) renderMoreHomeHeats();
            }, { rootMargin: '400px' });
            homeHeatsObserver.observe(sentinel);
        }

        let homeHeatsTopBtnListenerAdded = false;

        function setupHomeHeatsTopButton() {
            if (homeHeatsTopBtnListenerAdded) return;
            window.addEventListener('scroll', () => {
                const btn = document.getElementById('home-heats-top-btn');
                if (btn) btn.style.display = window.scrollY > 400 ? 'flex' : 'none';
            });
            homeHeatsTopBtnListenerAdded = true;
        }

        function scrollHomeHeatsToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Names/events come from scraped data and can contain apostrophes (O'Connor)
        // or double quotes (the "NATIONAL CHAMP" events), either of which breaks an
        // inline onclick="fn('...')" attribute: jsQuote escapes for the JS-string
        // layer, onclickArg additionally escapes for the surrounding HTML attribute.
        function jsQuote(value) {
            return String(value).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }
        function onclickArg(value) {
            return jsQuote(value).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // Event detail view. Uses the same roster grouping as the individual page:
        // pair on mutual partner claims first, then one-sided ones, so nobody renders
        // solo before another competitor claims them. Leftovers are genuine solos.
        function displayEventDetails(eventKey) {
            const eventInfo = heatEventsData.find(he => `${he.heat}|${he.event}` === eventKey)
                || heatEventsData.find(he => he.event === eventKey)
                || heatEventsData.find(he => (he.heat || he.event) === eventKey);
            if (!eventInfo) return;

            openDetailOverlay();

            const overlay = document.querySelector('.detail-overlay');
            const contentElement = overlay.classList.contains('active')
                ? document.getElementById('detailContentDisplay')
                : document.getElementById('contentDisplay');

            const competitors = eventInfo.competitors || [];

            const partnerInEvent = competitor => {
                const entry = participantsData[competitor]?.entries.find(
                    e => e.heat === eventInfo.heat && e.event === eventInfo.event
                );
                const claimed = entry?.partner;
                return claimed && competitors.includes(claimed) ? claimed : null;
            };

            const processed = new Set();
            const units = [];

            const pairUp = mutualOnly => {
                competitors.forEach(competitor => {
                    if (processed.has(competitor)) return;
                    const partner = partnerInEvent(competitor);
                    if (!partner || processed.has(partner)) return;
                    if (mutualOnly && partnerInEvent(partner) !== competitor) return;

                    units.push({ sortKey: competitor, members: [competitor, partner] });
                    processed.add(competitor);
                    processed.add(partner);
                });
            };

            pairUp(true);
            pairUp(false);

            competitors.forEach(competitor => {
                if (processed.has(competitor)) return;
                units.push({ sortKey: competitor, members: [competitor] });
                processed.add(competitor);
            });

            units.sort((a, b) => a.sortKey.localeCompare(b.sortKey));

            const coupleCount = units.filter(u => u.members.length > 1).length;
            const soloCount = units.filter(u => u.members.length === 1).length;
            const isSoloEvent = coupleCount === 0;

            trackEventViewed(eventInfo.event, eventInfo.heat, competitors.length, !isSoloEvent);

            const ageChipHtml = getAgeChipHtml(eventInfo.event);
            const levelChipHtml = getLevelChipHtml(eventInfo.event);

            document.getElementById('detailPersonName').textContent = eventInfo.event;
            // The countdown belongs to a person; clear whatever the last person left
            // behind, since updateDetailCountdown() bails out on a non-person name.
            const staleCountdown = document.getElementById('detailNextHeat');
            if (staleCountdown) staleCountdown.textContent = '';
            fillCountdownBar(document.getElementById('overlayCountdown'), '', '');
            fillCountdownBar(document.getElementById('desktopCountdown'), '', '');
            document.getElementById('detailEventCount').textContent =
                `${competitors.length} participant${competitors.length !== 1 ? 's' : ''}` +
                (coupleCount ? ` · ${coupleCount} couple${coupleCount !== 1 ? 's' : ''}` : '') +
                (coupleCount && soloCount ? ` · ${soloCount} solo` : '');

            let html = `
                <div class="person-header">
                    <div class="person-name" style="font-size:1.35em;line-height:1.3;">${eventInfo.event}</div>
                    <div style="margin: 8px 0 16px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                        <span style="font-size:0.7em;padding:3px 8px;background:${isSoloEvent ? 'var(--accent-dim)' : 'var(--accent)'};color:var(--bg-primary);border-radius:3px;font-weight:600;letter-spacing:0.05em;">${isSoloEvent ? 'SOLO' : 'COUPLE'}</span>
                        ${levelChipHtml}
                        ${ageChipHtml}
                        ${eventInfo.heat ? `<span style="font-size:0.8em;color:var(--text-secondary);">Heat ${eventInfo.heat}</span>` : ''}
                        ${eventInfo.time ? `<span style="font-size:0.8em;color:var(--text-secondary);">🕐 ${eventInfo.time}</span>` : ''}
                    </div>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-value">${competitors.length}</div>
                            <div class="stat-label">Participants</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${coupleCount}</div>
                            <div class="stat-label">Couples</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${soloCount}</div>
                            <div class="stat-label">Solo</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${units.length}</div>
                            <div class="stat-label">Entries</div>
                        </div>
                    </div>
                </div>
            `;

            if (!useMobileDetailOverlay()) {
                html += `
                    <button onclick="backToEventList()" style="margin-bottom:16px;padding:8px 14px;background:var(--bg-secondary);border:1px solid var(--bg-tertiary);border-radius:6px;color:var(--accent);cursor:pointer;font-size:0.85em;">← Back to events</button>
                `;
            }

            const ranking = buildHeatRanking(eventInfo.heat, eventInfo.event);
            if (ranking) {
                html += `<div class="event-item" style="margin-bottom:16px;">${ranking}</div>`;
            }

            html += `
                <div style="margin: 0 0 16px 0;">
                    <input type="text" class="event-participant-filter" placeholder="Filter participants by name..." autocomplete="off" oninput="filterEventParticipants(this)" style="width:100%;padding:10px 14px;background:var(--bg-secondary);border:1px solid var(--bg-tertiary);border-radius:6px;color:var(--text-primary);font-size:0.9em;">
                    <div class="event-participant-count" style="font-size:0.8em;color:var(--text-secondary);margin-top:6px;"></div>
                </div>

                <div class="event-roster" style="display:flex;flex-direction:column;gap:10px;">
            `;

            units.forEach(unit => {
                const searchKey = unit.members.join(' ').toLowerCase().replace(/"/g, '&quot;');
                const isCouple = unit.members.length > 1;
                const placementBadge = buildPlacementBadge(unit.members[0], eventInfo.heat, eventInfo.event, 'trailingNoWrap', eventInfo.time);

                html += `
                    <div class="event-roster-entry" data-names="${searchKey}" style="padding:12px;background:${isCouple ? 'rgba(0, 217, 255, 0.05)' : 'var(--bg-secondary)'};border:1px solid ${isCouple ? 'var(--accent-dim)' : 'var(--bg-tertiary)'};border-radius:4px;">
                        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                            ${unit.members
                                .map(m => `<span class="competitor-name" onclick="selectParticipant('${onclickArg(m)}', null, 'event_roster')" style="cursor:pointer;color:var(--accent);text-decoration:underline;">${formatName(m)}</span>`)
                                .join('<span style="color:var(--text-secondary);">&</span>')}
                            ${placementBadge}
                        </div>
                    </div>
                `;
            });

            html += `</div>`;

            contentElement.innerHTML = html;
            contentElement.scrollTop = 0;
        }

        function filterEventParticipants(inputEl) {
            const query = inputEl.value.trim().toLowerCase();
            const container = inputEl.closest('#contentDisplay, #detailContentDisplay');
            if (!container) return;

            const entries = container.querySelectorAll('.event-roster-entry');
            let visible = 0;

            entries.forEach(entry => {
                const match = !query || (entry.dataset.names || '').includes(query);
                entry.style.display = match ? '' : 'none';
                if (match) visible++;
            });

            const countEl = container.querySelector('.event-participant-count');
            if (countEl) {
                countEl.textContent = query ? `${visible} of ${entries.length} shown` : '';
            }
        }

        function backToEventList() {
            document.getElementById('contentDisplay').innerHTML = getHomeStats();
        }

        function switchView(view) {
            trackTabSwitch(view);
            const sidebar = document.querySelector('.sidebar');
            const contentArea = document.querySelector('.content-area');
            const tabParticipants = document.getElementById('tab-participants');
            const tabEvents = document.getElementById('tab-events');
            const partFilter = document.querySelector('.home-heats-participant-filter');
            const searchSection = document.querySelector('.search-section');

            if (view === 'participants') {
                sidebar.classList.remove('hidden');
                contentArea.classList.add('hidden');
                tabParticipants.style.background = 'var(--accent)';
                tabParticipants.style.color = 'var(--bg-primary)';
                tabEvents.style.background = 'transparent';
                tabEvents.style.color = 'var(--text-secondary)';
                if (searchSection) searchSection.classList.remove('hidden-for-events');
            } else {
                sidebar.classList.add('hidden');
                contentArea.classList.remove('hidden');
                tabEvents.style.background = 'var(--accent)';
                tabEvents.style.color = 'var(--bg-primary)';
                tabParticipants.style.background = 'transparent';
                tabParticipants.style.color = 'var(--text-secondary)';
                if (searchSection) searchSection.classList.add('hidden-for-events');
                // Clear participant search when switching to Events
                if (partFilter) {
                    partFilter.value = '';
                    const suggestions = document.getElementById('participant-suggestions');
                    if (suggestions) suggestions.innerHTML = '';
                    filterHomeHeats();
                }
            }
        }

        function showParticipantSuggestions() {
            const input = document.querySelector('.home-heats-participant-filter');
            const allHeats = JSON.parse(sessionStorage.getItem('allHomeHeats') || '[]');
            const value = input.value.toLowerCase().trim();

            let suggestions = [];
            if (value.length > 0) {
                const allNames = new Set();
                allHeats.forEach(h => {
                    h.competitorList.forEach(name => {
                        if (name.toLowerCase().includes(value)) {
                            allNames.add(name);
                        }
                    });
                });
                suggestions = Array.from(allNames).sort().slice(0, 8);
            }

            let html = '';
            if (suggestions.length > 0) {
                html = suggestions.map(name => `<div class="suggestion-item" onclick="selectParticipantFromSuggestion('${onclickArg(name)}')" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--bg-tertiary);font-size:0.85em;">${name}</div>`).join('');
            } else if (value.length > 0) {
                html = `<div style="padding:8px 12px;color:var(--text-secondary);font-size:0.85em;">No matches</div>`;
            }

            let box = document.getElementById('participant-suggestions');
            if (!box && html) {
                box = document.createElement('div');
                box.id = 'participant-suggestions';
                box.style.cssText = 'position:absolute;top:100%;left:0;right:0;background:var(--bg-secondary);border:1px solid var(--bg-tertiary);border-top:none;border-radius:0 0 3px 3px;max-height:240px;overflow-y:auto;z-index:10;';
                input.parentElement.style.position = 'relative';
                input.parentElement.appendChild(box);
            }
            if (box) box.innerHTML = html || '';
        }

        function selectParticipantFromSuggestion(name) {
            const input = document.querySelector('.home-heats-participant-filter');
            if (input) input.value = name;
            const suggestions = document.getElementById('participant-suggestions');
            if (suggestions) suggestions.innerHTML = '';
            filterHomeHeats();
            selectParticipant(name, null, 'event_filter_suggestion');
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            displayParticipants();
            closeDetailView(); // Close overlay when clearing search
            displayRecentlyViewed();
            document.getElementById('contentDisplay').innerHTML = getHomeStats();
        }

        // Toggle event details (expand/collapse)
        function toggleEvent(element) {
            event.stopPropagation(); // Prevent event bubbling
            element.classList.toggle('collapsed');

            const metaDiv = element.querySelector('.event-meta');
            const detailsDiv = element.querySelector('.event-details');

            const isNowCollapsed = element.classList.contains('collapsed');
            if (metaDiv) metaDiv.style.display = isNowCollapsed ? 'none' : 'grid';
            if (detailsDiv) detailsDiv.style.display = isNowCollapsed ? 'none' : 'block';

            // Track expand/collapse
            const eventTitle = element.querySelector('.event-title span span:nth-child(2)')?.textContent || 'Unknown';
            if (isNowCollapsed) {
                trackSectionCollapsed(eventTitle.trim());
            } else {
                trackSectionExpanded(eventTitle.trim());
            }
        }

        // Close overlay when resizing above mobile breakpoint
        window.addEventListener('resize', () => {
            // Never drop the overlay on iPad rotation — landscape is >1024px and
            // used to fall back to the desktop layout where the bar scrolls away.
            if (isTouchDevice()) {
                document.documentElement.classList.add('has-touch');
                syncOverlayTopInset();
                return;
            }
            closeDetailOverlay();
        });
        window.visualViewport?.addEventListener('resize', () => {
            if (isTouchDevice()) syncOverlayTopInset();
        });

        // Password gate — client-side only (see CSS comment above the
        // .password-gate rule for why this isn't real access control).
        const PASSWORD_GATE_KEY = 'comPageUnlocked';
        const PASSWORD_GATE_VALUE = '12345';

        function unlockPasswordGate() {
            document.getElementById('passwordGate').classList.add('gate-hidden');
            document.getElementById('mainContainer').classList.remove('gate-hidden');
            loadData();
        }

        function submitPasswordGate() {
            const input = document.getElementById('passwordGateInput');
            const errorEl = document.getElementById('passwordGateError');
            if (input.value === PASSWORD_GATE_VALUE) {
                sessionStorage.setItem(PASSWORD_GATE_KEY, '1');
                unlockPasswordGate();
            } else {
                errorEl.textContent = 'Incorrect password.';
                input.value = '';
                input.focus();
            }
        }

        document.getElementById('passwordGateInput').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') submitPasswordGate();
        });

        // Load data on page load, once past the password gate
        if (sessionStorage.getItem(PASSWORD_GATE_KEY) === '1') {
            unlockPasswordGate();
        } else {
            document.getElementById('passwordGateInput').focus();
        }

        async function loadAppVersion() {
            const el = document.getElementById('app-version');
            if (!el) return;
            try {
                const res = await fetch('com_assets/version.json');
                if (!res.ok) throw new Error(String(res.status));
                const v = await res.json();
                let stamp = '';
                if (v.updatedAt) {
                    const d = new Date(v.updatedAt);
                    if (!isNaN(d)) stamp = ' · ' + d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
                }
                el.textContent = `v${v.build}${v.commit && v.commit !== 'local' ? ' · ' + v.commit : ''}${stamp}`;
            } catch (e) {
                el.textContent = 'v?';
            }
        }

        loadAppVersion();
    </script>
</body>
</html>
