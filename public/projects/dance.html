<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dance Competition</title>
    <script src="dance_assets/competition-manager.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #252525;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #00d9ff;
            --accent-dim: #0099cc;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            padding: 60px 0 40px 0;
            border-bottom: 1px solid var(--bg-tertiary);
            margin-bottom: 40px;
            text-align: center;
        }

        h1 {
            font-size: 3.5em;
            font-weight: 200;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent), #00a8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.1em;
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .stats-mini {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        .stats-mini span {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .stats-mini strong {
            color: var(--accent);
        }

        .search-section {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--bg-tertiary);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 1em;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-tertiary);
            box-shadow: 0 0 0 2px rgba(0, 217, 255, 0.1);
        }

        button {
            padding: 14px 24px;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            color: var(--bg-primary);
            font-weight: 600;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        button:hover {
            background: var(--accent-dim);
            transform: translateY(-2px);
        }

        .main-content {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
        }

        .sidebar {
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .sidebar-header {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-weight: 600;
        }

        .results-count {
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-bottom: 12px;
            padding: 8px 0;
            border-bottom: 1px solid var(--bg-tertiary);
        }

        .participant-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .participant-item {
            padding: 12px;
            background: var(--bg-secondary);
            border-left: 2px solid transparent;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
            font-size: 0.95em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .participant-item:hover {
            background: var(--bg-tertiary);
            border-left-color: var(--accent);
        }

        .participant-item.active {
            background: var(--bg-tertiary);
            border-left-color: var(--accent);
            color: var(--accent);
        }

        .participant-count {
            font-size: 0.75em;
            color: var(--text-secondary);
        }

        .content-area {
            min-height: 600px;
        }

        .person-header {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--bg-tertiary);
        }

        .person-name {
            font-size: 2.5em;
            font-weight: 300;
            letter-spacing: -0.01em;
            margin-bottom: 24px;
            background: linear-gradient(135deg, var(--accent), #00a8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .stat-box {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 6px;
            border: 1px solid var(--bg-tertiary);
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 300;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
        }

        .events-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .event-item {
            background: var(--bg-secondary);
            border: 1px solid var(--bg-tertiary);
            border-radius: 6px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .event-item:hover {
            border-color: var(--accent);
            background: var(--bg-tertiary);
        }

        .event-item.collapsed {
            padding: 16px;
        }

        .event-item.collapsed .event-meta,
        .event-item.collapsed .event-details {
            display: none;
        }

        .event-item.collapsed .event-title {
            margin-bottom: 0;
        }

        .event-toggle {
            cursor: pointer;
            font-size: 1.2em;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .event-item.collapsed .event-toggle {
            transform: rotate(-90deg);
        }

        .event-details {
            margin-top: 16px;
        }

        .partner-section {
            background: var(--bg-primary);
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            border-left: 3px solid var(--accent);
        }

        .partner-label {
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .partner-name {
            font-size: 1.1em;
            font-weight: 600;
            color: var(--accent);
        }

        .couples-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .couple-pair {
            background: var(--bg-primary);
            padding: 10px 12px;
            border-radius: 4px;
            border-left: 2px solid var(--accent);
            flex: 0 1 auto;
        }

        .couple-separator {
            color: var(--text-secondary);
            margin: 0 4px;
        }

        .couple-name {
            color: var(--accent);
            cursor: pointer;
            text-decoration: none;
            transition: color 0.2s;
        }

        .couple-name:hover {
            color: var(--text-primary);
        }

        .event-title {
            font-size: 1.1em;
            font-weight: 500;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 12px;
        }

        .heat-label {
            background: var(--accent);
            color: var(--bg-primary);
            padding: 4px 12px;
            border-radius: 3px;
            font-size: 0.8em;
            font-weight: 600;
            white-space: nowrap;
        }

        .event-meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 20px;
            padding: 16px 0;
            border-top: 1px solid var(--bg-tertiary);
            border-bottom: 1px solid var(--bg-tertiary);
        }

        .meta-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .meta-label {
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
        }

        .meta-value {
            font-size: 0.95em;
            color: var(--text-primary);
        }

        .opponent-filter-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--bg-tertiary);
            border-radius: 6px;
            margin-top: 4px;
            max-height: 240px;
            overflow-y: auto;
            z-index: 10;
        }

        .opponent-suggestion-item {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid var(--bg-tertiary);
            font-size: 0.9em;
        }

        .opponent-suggestion-item:last-child {
            border-bottom: none;
        }

        .opponent-suggestion-item:hover {
            background: var(--bg-tertiary);
            color: var(--accent);
        }

        .opponent-suggestion-empty {
            padding: 10px 14px;
            color: var(--text-secondary);
            font-size: 0.85em;
        }

        .competitors-title {
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .competitors-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .competitor {
            padding: 10px 12px;
            background: var(--bg-primary);
            border-left: 2px solid var(--accent);
            border-radius: 3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95em;
        }

        .competitor-name {
            color: var(--accent);
            cursor: pointer;
            text-decoration: none;
            transition: color 0.2s;
        }

        .competitor-name:hover {
            color: var(--text-primary);
        }

        .role-badge {
            font-size: 0.7em;
            padding: 3px 8px;
            border-radius: 2px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-partner {
            background: rgba(0, 217, 255, 0.2);
            color: var(--accent);
        }

        .badge-opponent {
            background: rgba(160, 160, 160, 0.2);
            color: var(--text-secondary);
        }

        .solo-badge {
            background: rgba(0, 217, 255, 0.1);
            border-left-color: transparent;
            color: var(--text-secondary);
            padding: 12px;
            border-radius: 3px;
            font-size: 0.9em;
        }

        #all-competitors {
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.05), rgba(0, 168, 255, 0.05)) !important;
            border: 1px solid var(--accent-dim) !important;
        }

        #all-competitors .event-title {
            color: var(--accent);
            font-weight: 600;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .no-results-icon {
            font-size: 3em;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* Detail overlay styles - base (hidden on desktop) */
        .detail-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            z-index: 1000;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .detail-overlay.active {
            display: flex;
            opacity: 1;
        }

        .detail-back-btn,
        .detail-header,
        .detail-overlay {
            display: none; /* Hidden until mobile media query shows them */
        }

        /* Show countdown element on desktop */
        #desktopCountdown {
            font-size: 0.9em;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 24px;
            font-weight: 500;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .event-meta {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 2.5em;
            }

            /* Mobile detail overlay styles */
            .detail-header {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 16px;
                background: var(--bg-secondary);
                border-bottom: 1px solid var(--bg-tertiary);
                position: sticky;
                top: 0;
                z-index: 1001;
                flex-shrink: 0;
            }

            .detail-back-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 36px;
                height: 36px;
                background: transparent;
                border: none;
                color: var(--accent);
                font-size: 20px;
                cursor: pointer;
                transition: opacity 0.2s ease;
                flex-shrink: 0;
            }

            .detail-back-btn:active {
                opacity: 0.7;
            }

            .detail-header-info {
                display: flex;
                flex-direction: column;
                gap: 2px;
                flex: 1;
                min-width: 0;
            }

            .detail-person-name {
                display: block;
                font-size: 1em;
                font-weight: 600;
                color: var(--accent);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .detail-event-count {
                display: block;
                font-size: 0.75em;
                color: var(--text-secondary);
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }

            .detail-content {
                display: block;
                flex: 1;
                overflow-y: auto;
                padding: 20px;
                -webkit-overflow-scrolling: touch;
            }

            /* Hide main-content when overlay is active */
            .detail-overlay.active ~ .main-content {
                display: none;
            }

            /* Overlay animations */
            @keyframes slideDown {
                from {
                    opacity: 0;
                    transform: translateY(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }

            .detail-overlay.active .detail-header {
                animation: slideDown 0.3s ease;
            }

            .detail-overlay.active .detail-content {
                animation: fadeIn 0.3s ease 0.1s both;
            }
        }

        @media (max-width: 640px) {
            .container {
                padding: 16px;
            }
            header {
                padding: 40px 0 30px 0;
                margin-bottom: 30px;
            }
            h1 {
                font-size: 2em;
            }
            .stats-mini {
                gap: 20px;
                font-size: 0.8em;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }

        .detail-next-heat {
            font-size: 0.9em;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 4px;
            font-weight: 500;
        }

        .event-item.completed {
            opacity: 0.5;
        }

        .event-item.completed .event-title {
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="subtitle" id="competitionTitle">Dance Competition</div>
            <h1>Event Competitors</h1>
            <div style="margin-top:8px;display:flex;gap:12px;align-items:center;justify-content:center;">
                <div id="competitionSelector"></div>
                <a href="results.html" style="font-size:0.75em;color:var(--accent);text-decoration:none;opacity:0.8;">🏆 View Results →</a>
            </div>
            <div class="stats-mini">
                <span><strong id="totalParticipants">-</strong> Participants</span>
                <span><strong id="totalEvents">-</strong> Events</span>
                <span><strong id="totalHeats">-</strong> Heats</span>
            </div>
        </header>

        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Search participants...">
            <button onclick="clearSearch()">Clear</button>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <div class="sidebar-header">Recently Viewed</div>
                <div id="recentlyViewedContainer" style="margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--bg-tertiary);"></div>

                <div class="sidebar-header">Participants</div>
                <div class="results-count" id="resultsCount"></div>
                <ul class="participant-list" id="participantList"></ul>
            </div>

            <div class="content-area">
                <div id="contentDisplay">
                    <div class="loading">Loading data...</div>
                </div>
            </div>
        </div>

        <div class="detail-overlay">
            <div class="detail-header">
                <button class="detail-back-btn" onclick="closeDetailView()">←</button>
                <div class="detail-header-info">
                    <div class="detail-person-name" id="detailPersonName"></div>
                    <div class="detail-event-count" id="detailEventCount"></div>
                </div>
            </div>
            <div class="detail-content" id="detailContentDisplay">
                <div class="loading">Loading data...</div>
            </div>
        </div>
    </div>

    <script>
        let participantsData = {};
        let heatEventsData = [];
        let sortedParticipants = [];
        let resultsData = {};
        let personResultsData = {};
        let judgesData = {};

        // Format names from "Last, First" to "First Last"
        function formatName(name) {
            if (!name || !name.includes(',')) return name;
            const [last, first] = name.split(',').map(n => n.trim());
            return `${first} ${last}`;
        }

        // Get placement string for a person in a specific heat+event
        function getPersonPlacement(personName, heatNum, eventName) {
            const results = personResultsData[personName] || [];
            const entry = results.find(r => r.heat === heatNum && r.event === eventName);
            return entry ? entry.placement : null;
        }

        // Format placement as medal emoji + ordinal
        function formatPlacement(placement) {
            if (!placement) return '';
            const n = parseInt(placement);
            if (isNaN(n)) return placement;
            const medal = n === 1 ? '🥇' : n === 2 ? '🥈' : n === 3 ? '🥉' : null;
            const suffix = n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th';
            return medal ? `${medal} ${n}${suffix}` : `${n}${suffix}`;
        }

        // Build full heat ranking HTML from results.json
        function buildHeatRanking(heatNum, eventName) {
            const heat = resultsData[heatNum + '|' + eventName];
            if (!heat || !heat.finalSummary || heat.finalSummary.length === 0) return '';

            // Collect judge IDs from dances
            const judgeIds = [];
            (heat.dances || []).forEach(d => {
                (d.judges || []).forEach(id => {
                    if (!judgeIds.includes(id)) judgeIds.push(id);
                });
            });
            judgeIds.sort();
            const judgeNames = judgeIds
                .map(id => judgesData[id] || id)
                .filter(n => n);

            const sorted = [...heat.finalSummary].sort((a, b) => {
                const pa = parseInt(a.placement) || 999;
                const pb = parseInt(b.placement) || 999;
                return pa - pb;
            });

            let html = `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--bg-tertiary);">`;

            if (judgeNames.length > 0) {
                html += `<div style="font-size:0.75em;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;">Judges</div>`;
                html += `<div style="font-size:0.78em;color:var(--text-secondary);margin-bottom:8px;line-height:1.5;">${judgeNames.join(' · ')}</div>`;
            }

            html += `<div style="font-size:0.75em;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;">Full Ranking</div>`;

            sorted.forEach(row => {
                const place = parseInt(row.placement) || 0;
                const medal = place === 1 ? '🥇' : place === 2 ? '🥈' : place === 3 ? '🥉' : `${place}.`;
                const danceParts = Object.entries(row.dances || {})
                    .map(([d, p]) => `<span style="opacity:0.6;font-size:0.78em;">${d}:${p}</span>`)
                    .join(' ');
                html += `<div style="display:flex;align-items:baseline;gap:6px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.05);">
                    <span style="min-width:26px;font-weight:600;font-size:0.9em;">${medal}</span>
                    <span style="flex:1;font-size:0.85em;opacity:0.9;">${row.names}</span>
                    <span style="display:flex;gap:4px;">${danceParts}</span>
                </div>`;
            });

            html += `</div>`;
            return html;
        }

        function buildJudgeBreakdown(heatNum, eventName, personName) {
            const heat = resultsData[heatNum + '|' + eventName];
            if (!heat || !heat.dances) return '';

            const personEntries = personResultsData[personName] || [];
            const personEntry = personEntries.find(e => e.heat === heatNum && e.event === eventName);
            if (!personEntry) return '';

            const personNumber = personEntry.number;
            const personNames = personEntry.names;
            const totalCompetitors = heat.finalSummary?.length || 0;

            const dancesWithMarks = [];
            const allJudgeIds = new Set();

            (heat.dances || []).forEach(d => {
                const row = (d.rows || []).find(r => r.number === personNumber || r.names === personNames);
                if (row && row.marks && Object.keys(row.marks).length > 0) {
                    dancesWithMarks.push({ dance: d.dance, marks: row.marks });
                    Object.keys(row.marks).forEach(id => allJudgeIds.add(id));
                }
            });

            if (dancesWithMarks.length === 0 || allJudgeIds.size === 0) return '';

            const judgeIds = [...allJudgeIds].sort();

            html += `<div id="${toggleId}" style="display:none;margin-top:6px;">`;

            html += `<table style="width:100%;border-collapse:collapse;font-size:0.78em;">`;
            html += `<thead><tr>`;
            html += `<th style="text-align:left;padding:3px 8px 3px 0;color:var(--text-secondary);font-weight:600;border-bottom:1px solid var(--bg-tertiary);">Judge</th>`;
            dancesWithMarks.forEach(d => {
                html += `<th style="text-align:center;padding:3px 6px;color:var(--text-secondary);font-weight:600;border-bottom:1px solid var(--bg-tertiary);">${d.dance}</th>`;
            });
            if (dancesWithMarks.length > 1) {
                html += `<th style="text-align:center;padding:3px 6px;color:var(--text-secondary);font-weight:600;border-bottom:1px solid var(--bg-tertiary);">Σ</th>`;
            }
            html += `</tr></thead><tbody>`;

            judgeIds.forEach(id => {
                const nameParts = (judgesData[id] || id).split(' ');
                const displayName = nameParts[0];
                let total = 0;
                let allPresent = true;

                html += `<tr>`;
                html += `<td style="padding:4px 8px 4px 0;color:var(--text-secondary);white-space:nowrap;">${displayName}</td>`;

                dancesWithMarks.forEach(d => {
                    const mark = d.marks[id];
                    if (mark !== undefined && mark !== '') {
                        const rank = parseInt(mark);
                        total += rank;
                        const ratio = totalCompetitors > 1 ? (rank - 1) / (totalCompetitors - 1) : 0;
                        const hue = Math.round((1 - ratio) * 120);
                        html += `<td style="text-align:center;padding:3px 4px;"><span style="display:inline-block;min-width:22px;padding:1px 4px;font-weight:600;border-radius:3px;background:hsl(${hue},40%,20%);color:hsl(${hue},55%,72%);">${mark}</span></td>`;
                    } else {
                        allPresent = false;
                        html += `<td style="text-align:center;padding:3px 4px;color:var(--text-secondary);">—</td>`;
                    }
                });

                if (dancesWithMarks.length > 1) {
                    html += `<td style="text-align:center;padding:3px 4px;font-weight:600;color:var(--text-primary);">${allPresent ? total : '—'}</td>`;
                }
                html += `</tr>`;
            });

            html += `</tbody></table></div></div>`;
            return html;
        }

        // Parse heat time from format: "03:38PM Sunday" or "06:54PM Sunday Later rounds: 5@07:07PM Sunday"
        function parseHeatTime(timeString) {
            if (!timeString) return null;

            // Match first occurrence of HH:MMAM/PM DayName
            const match = timeString.match(/(\d{1,2}):(\d{2})(AM|PM)\s+(\w+)/);
            if (!match) return null;

            return {
                hour: parseInt(match[1]),
                minute: parseInt(match[2]),
                meridiem: match[3],
                dayName: match[4]
            };
        }

        // Calculate next occurrence of a day/time combination
        function calculateNextOccurrence(parsedTime) {
            if (!parsedTime) return null;

            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const targetDayIndex = days.indexOf(parsedTime.dayName);

            if (targetDayIndex === -1) return null;

            const now = new Date();
            const todayIndex = now.getDay();

            // Convert to 24-hour format
            let hour = parsedTime.hour;
            if (parsedTime.meridiem === 'PM' && hour !== 12) {
                hour += 12;
            } else if (parsedTime.meridiem === 'AM' && hour === 12) {
                hour = 0;
            }

            // Create date for target day/time
            const result = new Date(now);
            result.setHours(hour, parsedTime.minute, 0, 0);

            // Calculate days to add
            let daysToAdd = targetDayIndex - todayIndex;
            if (daysToAdd < 0 || (daysToAdd === 0 && result <= now)) {
                daysToAdd += 7;
            }

            result.setDate(result.getDate() + daysToAdd);
            return result;
        }

        // Get next upcoming heat for a person (within current competition, not next week)
        function getNextHeatForPerson(personData) {
            if (!personData || !personData.entries || personData.entries.length === 0) {
                return null;
            }

            const now = new Date();
            const upcomingHeats = [];
            const seenHeatTimes = new Set(); // Track unique heat times to avoid duplicates

            // Calculate next occurrence for each entry
            personData.entries.forEach(entry => {
                const parsed = parseHeatTime(entry.time);
                if (parsed) {
                    // Create a date for this week's occurrence
                    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                    const targetDayIndex = days.indexOf(parsed.dayName);
                    const todayIndex = now.getDay();

                    let hour = parsed.hour;
                    if (parsed.meridiem === 'PM' && hour !== 12) {
                        hour += 12;
                    } else if (parsed.meridiem === 'AM' && hour === 12) {
                        hour = 0;
                    }

                    const eventDate = new Date(now);
                    eventDate.setHours(hour, parsed.minute, 0, 0);

                    let daysToAdd = targetDayIndex - todayIndex;
                    if (daysToAdd < 0 || (daysToAdd === 0 && eventDate <= now)) {
                        // Event was earlier in week or already passed today - don't show (competition is over)
                        return;
                    }

                    eventDate.setDate(eventDate.getDate() + daysToAdd);

                    const timeKey = eventDate.getTime();
                    if (!seenHeatTimes.has(timeKey)) {
                        upcomingHeats.push({
                            heat: entry.heat,
                            time: eventDate,
                            originalTime: entry.time
                        });
                        seenHeatTimes.add(timeKey);
                    }
                }
            });

            // Return earliest upcoming heat (don't jump to next week)
            if (upcomingHeats.length === 0) {
                return null;
            }

            return upcomingHeats.sort((a, b) => a.time - b.time)[0];
        }

        // Get currently running heat for a person (heat that has started but next one hasn't)
        function getCurrentlyRunningHeat(personData) {
            if (!personData || !personData.entries || personData.entries.length === 0) {
                return null;
            }

            const now = new Date();
            const nextHeat = getNextHeatForPerson(personData);

            // Find the most recently started heat
            let currentHeat = null;
            let latestStartTime = null;

            personData.entries.forEach(entry => {
                const parsed = parseHeatTime(entry.time);
                if (parsed) {
                    // Create a date for this week's occurrence
                    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                    const targetDayIndex = days.indexOf(parsed.dayName);
                    const todayIndex = now.getDay();

                    // Convert to 24-hour format
                    let hour = parsed.hour;
                    if (parsed.meridiem === 'PM' && hour !== 12) {
                        hour += 12;
                    } else if (parsed.meridiem === 'AM' && hour === 12) {
                        hour = 0;
                    }

                    const eventDate = new Date(now);
                    eventDate.setHours(hour, parsed.minute, 0, 0);

                    // Adjust to correct day of week
                    let daysToAdd = targetDayIndex - todayIndex;
                    if (daysToAdd < 0) {
                        daysToAdd += 7; // Event was earlier in week, was last week
                    } else if (daysToAdd > 0 || (daysToAdd === 0 && eventDate > now)) {
                        daysToAdd = 0; // Event is today and hasn't started, or later this week
                    }
                    eventDate.setDate(eventDate.getDate() + daysToAdd);

                    // Check if this heat has started (heat time <= now) and is the latest one
                    if (eventDate <= now) {
                        if (!latestStartTime || eventDate > latestStartTime) {
                            latestStartTime = eventDate;
                            currentHeat = {
                                heat: entry.heat,
                                time: eventDate,
                                originalTime: entry.time
                            };
                        }
                    }
                }
            });

            // Return current heat only if it's still within 1 minute of starting
            if (currentHeat) {
                const timeSinceStart = now - latestStartTime;
                const oneMinuteMs = 60000;
                if (timeSinceStart < oneMinuteMs) {
                    return currentHeat;
                }
            }

            return null;
        }

        // Format countdown display text (with days, hours, minutes, seconds)
        function formatCountdownTime(nextHeatTime) {
            if (!nextHeatTime) {
                return '✓ All events completed';
            }

            const now = new Date();
            const diffMs = nextHeatTime.time - now;

            if (diffMs < 0) {
                return '✓ Event started';
            }

            const totalSeconds = Math.floor(diffMs / 1000);
            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const mins = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;
            const heatNum = nextHeatTime.heat || '';

            if (totalSeconds < 60) {
                // Less than 1 minute - show seconds only
                return `🕐 Next: ${heatNum} in ${secs}s`;
            } else if (totalSeconds < 3600) {
                // Less than 1 hour - show minutes and seconds
                return `🕐 Next: ${heatNum} in ${mins}m ${secs}s`;
            } else if (totalSeconds < 86400) {
                // Less than 1 day - show hours, minutes, seconds
                return `🕐 Next: ${heatNum} in ${hours}h ${mins}m ${secs}s`;
            } else {
                // 1 day or more - show days, hours, minutes, seconds
                return `🕐 Next: ${heatNum} in ${days}d ${hours}h ${mins}m ${secs}s`;
            }
        }

        // Check if an event is completed (its heat time has passed)
        function isEventCompleted(timeString) {
            if (!timeString) return false;

            const parsed = parseHeatTime(timeString);
            if (!parsed) return false;

            const now = new Date();
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const targetDayIndex = days.indexOf(parsed.dayName);
            if (targetDayIndex === -1) return false;

            const todayIndex = now.getDay();

            // Convert to 24-hour format
            let hour = parsed.hour;
            if (parsed.meridiem === 'PM' && hour !== 12) {
                hour += 12;
            } else if (parsed.meridiem === 'AM' && hour === 12) {
                hour = 0;
            }

            // Create date for this occurrence of the target day
            const eventDate = new Date(now);
            eventDate.setHours(hour, parsed.minute, 0, 0);

            // If target day is later in the week, adjust to that day
            // If target day is earlier or same, keep current week (already passed)
            let daysToAdd = targetDayIndex - todayIndex;
            if (daysToAdd > 0) {
                // Event is later in this week, hasn't happened yet
                return false;
            } else if (daysToAdd === 0) {
                // Event is today - check if time has passed
                return eventDate < now;
            } else {
                // Event is earlier in week - it already happened
                return true;
            }
        }

        // Update completed status of all visible events
        function updateEventCompletionStatus() {
            // Get all event items
            const eventItems = document.querySelectorAll('.event-item');

            eventItems.forEach(item => {
                // For "All Competitors" section, skip (no time)
                if (item.id === 'all-competitors') return;

                // Get the event title and heat label
                const eventTitle = item.querySelector('.event-title');
                const heatLabel = item.querySelector('.heat-label');
                if (!eventTitle || !heatLabel) return;

                // Extract heat text from label
                const heatText = heatLabel.textContent.trim();

                // Extract event name - it's the text after the toggle icon
                const eventToggle = eventTitle.querySelector('.event-toggle');
                const firstSpan = eventTitle.querySelector('span');
                if (!firstSpan) return;

                // Get the event text (everything in the span except the toggle)
                let eventText = '';
                for (let node of firstSpan.childNodes) {
                    if (node.nodeType === Node.TEXT_NODE) {
                        eventText += node.textContent;
                    }
                }
                eventText = eventText.trim();

                if (!eventText || !heatText) return;

                // Find matching entry from current participant
                const currentName = document.querySelector('.person-name')?.textContent;
                if (!currentName || !participantsData[currentName]) return;

                const personData = participantsData[currentName];
                let eventTime = null;

                // Find matching entry
                for (let entry of personData.entries) {
                    if (entry.heat === heatText && entry.event === eventText) {
                        eventTime = entry.time;
                        break;
                    }
                }

                if (!eventTime) return;

                // Check if event is completed
                const isCompleted = isEventCompleted(eventTime);

                // Update CSS class
                if (isCompleted) {
                    item.classList.add('completed');
                } else {
                    item.classList.remove('completed');
                }
            });
        }

        // Update countdown display in detail header (both desktop and mobile)
        function updateDetailCountdown() {
            // Try to get person name from mobile detail view or desktop view
            let currentName = document.getElementById('detailPersonName')?.textContent;
            if (!currentName) {
                currentName = document.querySelector('.person-name')?.textContent;
            }

            if (!currentName || !participantsData[currentName]) {
                return;
            }

            const personData = participantsData[currentName];
            const runningHeat = getCurrentlyRunningHeat(personData);
            const nextHeat = getNextHeatForPerson(personData);

            let countdownText;
            if (runningHeat) {
                // Heat is currently running
                const heatNum = runningHeat.heat || '';
                countdownText = `🔴 ${heatNum} is running`;
            } else if (nextHeat) {
                // Show countdown to next heat
                countdownText = formatCountdownTime(nextHeat);
            } else {
                // No more heats
                countdownText = '✓ All events completed';
            }

            // Update mobile countdown (detail overlay)
            let mobileCountdown = document.getElementById('detailNextHeat');
            if (!mobileCountdown) {
                const headerInfo = document.querySelector('.detail-header-info');
                if (headerInfo) {
                    mobileCountdown = document.createElement('div');
                    mobileCountdown.id = 'detailNextHeat';
                    mobileCountdown.className = 'detail-next-heat';
                    headerInfo.appendChild(mobileCountdown);
                }
            }
            if (mobileCountdown) {
                mobileCountdown.textContent = countdownText;
            }

            // Update desktop countdown
            const desktopCountdown = document.getElementById('desktopCountdown');
            if (desktopCountdown) {
                desktopCountdown.textContent = countdownText;
            }

            // Update completed status of events
            updateEventCompletionStatus();
        }

        // Google Analytics Event Tracking
        function trackEvent(eventName, eventData = {}) {
          if (typeof gtag !== 'undefined') {
            gtag('event', eventName, {
              'page_title': document.title,
              ...eventData
            });
          }
        }

        // Load data from JSON files
        // Static hosts serve the SPA fallback page (200 + HTML) for missing files,
        // so a JSON content-type is the only reliable signal that the file exists.
        async function readJson(res, fallback) {
            if (!res.ok) return fallback;
            if (!(res.headers.get('content-type') || '').includes('json')) return fallback;
            return res.json();
        }

        async function loadData() {
            try {
                // Clear previous data and search
                document.getElementById('searchInput').value = '';
                document.getElementById('contentDisplay').innerHTML = '<div class="loading">Loading data...</div>';
                document.getElementById('participantList').innerHTML = '';
                document.getElementById('resultsCount').textContent = '0 / 0';
                document.getElementById('recentlyViewedContainer').innerHTML = '<div style="font-size: 0.9em; color: var(--text-secondary); padding: 8px 0;">None yet</div>';

                // Initialize and load competition metadata
                if (!window.competitionManager.competitions || window.competitionManager.competitions.length === 0) {
                    await window.competitionManager.load();
                }

                // Update UI with current competition name
                document.getElementById('competitionTitle').textContent = window.competitionManager.getCompetitionName();
                window.competitionManager.renderSelector('competitionSelector');

                const participantsPath = window.competitionManager.getDataPath('participants.json');
                const heatEventsPath = window.competitionManager.getDataPath('heat_events.json');
                const resultsPath = window.competitionManager.getDataPath('results.json');
                const personResultsPath = window.competitionManager.getDataPath('person_results.json');
                const judgesPath = window.competitionManager.getDataPath('judges.json');

                console.log('Loading from paths:', { participantsPath, heatEventsPath, resultsPath });

                const [participantsRes, heatEventsRes, resultsRes, personResultsRes, judgesRes] = await Promise.all([
                    fetch(participantsPath),
                    fetch(heatEventsPath),
                    fetch(resultsPath),
                    fetch(personResultsPath),
                    fetch(judgesPath)
                ]);

                console.log('Fetch responses:', {
                    participants: participantsRes.status,
                    heatEvents: heatEventsRes.status,
                    results: resultsRes.status
                });

                if (!participantsRes.ok) throw new Error(`Failed to load participants: ${participantsRes.status}`);
                if (!heatEventsRes.ok) throw new Error(`Failed to load heat events: ${heatEventsRes.status}`);

                participantsData = await readJson(participantsRes, null);
                heatEventsData = await readJson(heatEventsRes, null);
                if (!participantsData) throw new Error(`participants.json is missing or not JSON at ${participantsPath}`);
                if (!heatEventsData) throw new Error(`heat_events.json is missing or not JSON at ${heatEventsPath}`);

                resultsData = await readJson(resultsRes, {});
                personResultsData = await readJson(personResultsRes, {});
                judgesData = await readJson(judgesRes, {});

                console.log('Data loaded successfully:', {
                    participants: Object.keys(participantsData).length,
                    heats: heatEventsData.length
                });
                sortedParticipants = Object.keys(participantsData).sort();

                // Update dynamic stats
                document.getElementById('totalParticipants').textContent = sortedParticipants.length;
                document.getElementById('totalEvents').textContent = heatEventsData.length;
                const uniqueHeats = new Set(heatEventsData.map(e => e.heat)).size;
                document.getElementById('totalHeats').textContent = uniqueHeats;

                displayRecentlyViewed();
                displayParticipants();
                document.getElementById('contentDisplay').innerHTML = getHomeStats();

                // Initialize countdown timer - updates every second
                setInterval(updateDetailCountdown, 1000);
                // Call immediately on first load
                updateDetailCountdown();
            } catch (error) {
                console.error('Data loading error:', error);
                const errorMsg = error.message || 'Unknown error';
                document.getElementById('contentDisplay').innerHTML =
                    `<div class="no-results"><div style="color:red;">Error loading data: ${errorMsg}</div><div style="font-size:0.8em;margin-top:12px;color:#999;">Check browser console for details</div></div>`;
            }
        }

        function displayParticipants(filter = '') {
            const list = document.getElementById('participantList');
            list.innerHTML = '';

            const filtered = sortedParticipants.filter(name =>
                name.toLowerCase().includes(filter.toLowerCase())
            );

            // Track search events
            if (filter.trim().length > 0) {
                trackSearch(filter, filtered.length);
            }

            document.getElementById('resultsCount').textContent =
                `${filtered.length} / ${sortedParticipants.length}`;

            filtered.forEach(name => {
                const entryCount = participantsData[name].entries.length;
                const item = document.createElement('li');
                item.className = 'participant-item';
                item.innerHTML = `
                    <span>${name}</span>
                    <span class="participant-count">${entryCount}</span>
                `;
                item.onclick = () => selectParticipant(name, item);
                list.appendChild(item);
            });
        }

        function getRecentlyViewedKey() {
            const compId = window.competitionManager.getActive()?.id || 'default';
            return `danceRecentlyViewed_${compId}`;
        }

        function addToRecentlyViewed(name) {
            const key = getRecentlyViewedKey();
            let recentlyViewed = JSON.parse(localStorage.getItem(key) || '[]');

            // Remove if already exists
            recentlyViewed = recentlyViewed.filter(n => n !== name);

            // Add to front
            recentlyViewed.unshift(name);

            // Keep only last 10
            recentlyViewed = recentlyViewed.slice(0, 10);

            localStorage.setItem(key, JSON.stringify(recentlyViewed));
            displayRecentlyViewed();
        }

        function displayRecentlyViewed() {
            const key = getRecentlyViewedKey();
            const recentlyViewed = JSON.parse(localStorage.getItem(key) || '[]');
            const container = document.getElementById('recentlyViewedContainer');

            if (recentlyViewed.length === 0) {
                container.innerHTML = '<div style="font-size: 0.9em; color: var(--text-secondary); padding: 8px 0;">None yet</div>';
                return;
            }

            let html = '<ul style="list-style: none; display: flex; flex-direction: column; gap: 4px;">';
            recentlyViewed.forEach(name => {
                const entryCount = participantsData[name]?.entries.length || 0;
                html += `
                    <li class="participant-item" style="padding: 8px; cursor: pointer;" onclick="trackRecentlyViewedClick('${name}'); searchAndSelect('${name}')">
                        <span>${name}</span>
                        <span class="participant-count">${entryCount}</span>
                    </li>
                `;
            });
            html += '</ul>';
            container.innerHTML = html;
        }

        function selectParticipant(name, element) {
            document.querySelectorAll('.participant-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            // Track competitor view
            const entryCount = participantsData[name]?.entries.length || 0;
            trackCompetitorViewed(name, entryCount);

            // Add to recently viewed
            addToRecentlyViewed(name);

            // Update countdown timer immediately
            updateDetailCountdown();

            // Show overlay on mobile
            const overlay = document.querySelector('.detail-overlay');
            if (window.innerWidth <= 768) {
                overlay.classList.add('active');
            }

            // Update header text
            document.getElementById('detailPersonName').textContent = name;

            // Calculate completed vs upcoming events
            let completedCount = 0;
            const data = participantsData[name];

            if (data && data.entries) {
                data.entries.forEach(entry => {
                    if (isEventCompleted(entry.time)) {
                        completedCount++;
                    }
                });
            }

            const upcomingCount = entryCount - completedCount;
            document.getElementById('detailEventCount').textContent = `${entryCount} event${entryCount !== 1 ? 's' : ''} (${completedCount} completed, ${upcomingCount} left)`;

            displayPersonDetails(name);
        }

        function displayPersonDetails(name) {
            const data = participantsData[name];
            const overlay = document.querySelector('.detail-overlay');
            const contentElement = (overlay && overlay.classList.contains('active')) ?
                document.getElementById('detailContentDisplay') :
                document.getElementById('contentDisplay');

            if (!data || data.entries.length === 0) {
                contentElement.innerHTML = `<div class="no-results"><div>No events</div></div>`;
                return;
            }

            const partners = new Set(data.entries.map(e => e.partner).filter(p => p));
            const soloCount = data.entries.filter(e => !e.partner).length;
            const allEventCompetitors = new Set();

            data.entries.forEach(entry => {
                const eventInfo = heatEventsData.find(he => he.heat === entry.heat && he.event === entry.event);
                if (eventInfo) {
                    eventInfo.competitors.forEach(c => {
                        if (c !== name) allEventCompetitors.add(c);
                    });
                }
            });

            let html = `
                <div class="person-header">
                    <div class="person-name">${name}</div>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-value">${data.entries.length}</div>
                            <div class="stat-label">Events</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${partners.size}</div>
                            <div class="stat-label">Partners</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${soloCount}</div>
                            <div class="stat-label">Solo</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${allEventCompetitors.size}</div>
                            <div class="stat-label">Competitors</div>
                        </div>
                    </div>
                    <div id="desktopCountdown" style="margin-top: 20px;"></div>
                </div>
            `;

            // Build all competitors section FIRST (appears at top)
            // Separate partners from general competitors
            const partnerSet = partners; // partners already identified above
            const allCompetitors = {};
            const partnerCompetitors = {};

            data.entries.forEach(entry => {
                const eventInfo = heatEventsData.find(he => he.heat === entry.heat && he.event === entry.event);
                if (eventInfo) {

        function filterHeatsByOpponent(value, inputEl) {
            const query = value.trim().toLowerCase();
            const container = inputEl.closest('#contentDisplay, #detailContentDisplay');
            if (!container) return;

            const items = container.querySelectorAll('.events-list > .event-item');
            let visibleCount = 0;

            items.forEach(item => {
                const competitors = item.dataset.competitors || '';
                const match = !query || competitors.includes(query);
                item.style.display = match ? '' : 'none';
                if (match) visibleCount++;
            });

            const countEl = container.querySelector('.opponent-filter-count');
            if (countEl) {
                countEl.textContent = query ? `${visibleCount} of ${items.length} heats shown` : '';
            }

            renderOpponentSuggestions(query, inputEl);
        }

        function renderOpponentSuggestions(query, inputEl) {
            const suggestionsEl = inputEl.parentElement.querySelector('.opponent-filter-suggestions');
            if (!suggestionsEl) return;

            if (!query) {
                suggestionsEl.style.display = 'none';
                suggestionsEl.innerHTML = '';
                return;
            }

            const allOpponents = (inputEl.dataset.allOpponents || '').split('|').filter(Boolean);
            const matches = allOpponents.filter(o => o.toLowerCase().includes(query)).sort();

            if (matches.length === 0) {
                suggestionsEl.innerHTML = `<div class="opponent-suggestion-empty">No opponents match "${query}"</div>`;
                suggestionsEl.style.display = 'block';
                return;
            }

            suggestionsEl.innerHTML = matches.map(o =>
                `<div class="opponent-suggestion-item" onmousedown="selectOpponentSuggestion('${o.replace(/'/g, "\\'")}', this)">${o}</div>`
            ).join('');
            suggestionsEl.style.display = 'block';
        }

            filterHeatsByOpponent(name, inputEl);
            suggestionsEl.style.display = 'none';

            const heats = Object.values(heatStats);
            const smallHeats = heats.filter(h => h.competitors <= 3).sort((a, b) => a.competitors - b.competitors);
            const topHeats = [...heats].sort((a, b) => b.competitors - a.competitors).slice(0, 5);

            // Count by competitor size for summary
            const smallBySizes = {};
            smallHeats.forEach(h => {
                smallBySizes[h.competitors] = (smallBySizes[h.competitors] || 0) + 1;
            });

            let html = `
                <div style="padding: 40px 20px;">
                    <div style="text-align: center; margin-bottom: 50px;">
                        <div style="font-size: 2em; color: var(--accent); margin-bottom: 12px;">👥</div>
                        <div style="font-size: 1.2em; color: var(--text-secondary);">Select a participant</div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; max-width: 1000px; margin: 0 auto;">
                        <!-- Small Heats -->
                        <div>
                            <div style="font-size: 0.9em; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-secondary); margin-bottom: 16px; font-weight: 600; cursor: pointer; user-select: none;" onclick="toggleStatsSection(this, 'small-heats')">
                                <span style="display: inline-block; margin-right: 8px; transition: transform 0.2s;">▼</span>🤏 Heats with 3 or Fewer
                            </div>
                            <div id="small-heats-content" style="display: flex; flex-direction: column; gap: 8px;">
            `;

            if (smallHeats.length === 0) {
                html += `<div style="font-size: 0.9em; color: var(--text-secondary); padding: 12px; background: var(--bg-secondary); border-radius: 4px;">None</div>`;
            } else {
                // Show breakdown by competitor count, with hidden details
                [1, 2, 3].forEach(count => {
                    if (smallBySizes[count]) {
                        const heatsForCount = smallHeats.filter(h => h.competitors === count);
                        const countId = `small-heats-${count}`;
                        html += `
                            <div style="padding: 12px; background: var(--bg-secondary); border-radius: 4px; border-left: 3px solid var(--accent-dim); margin-bottom: 8px; cursor: pointer;" onclick="toggleHeatsDetail(this, '${countId}')">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span style="display: inline-block; transform: rotate(-90deg); transition: transform 0.2s;">▼</span>
                                    <div>
                                        <div style="font-weight: 600; color: var(--text-primary);">${smallBySizes[count]} event${smallBySizes[count] !== 1 ? 's' : ''}</div>
                                        <div style="font-size: 0.8em; color: var(--text-secondary);">${count} competitor${count !== 1 ? 's' : ''}</div>
                                    </div>
                                </div>
                                <div id="${countId}" style="display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--bg-tertiary); max-height: 300px; overflow-y: auto;">
                        `;
                        heatsForCount.forEach((h, idx) => {
                            const heatDetailId = `${countId}-heat-${idx}`;
                            const heatEvent = heatEventsData.find(he => he.heat === h.heat || he.event === h.name);
                            const competitors = heatEvent?.competitors || [];
                            const competitorNames = competitors.join(', ');
                            html += `
                                <div style="padding: 8px; margin-bottom: 6px; background: var(--bg-tertiary); border-radius: 3px; cursor: pointer;" onclick="toggleHeatDetail(this, '${heatDetailId}')">
                                    <div style="display: flex; align-items: center; gap: 6px;">
                                        <span style="display: inline-block; font-size: 0.75em; transform: rotate(-90deg); transition: transform 0.2s;">▼</span>
                                        <div style="flex: 1; font-size: 0.85em; color: var(--text-primary);">${h.name}</div>
                                        <div style="font-size: 0.7em; color: var(--text-secondary);">${count} comp.</div>
                                    </div>
                                    <div id="${heatDetailId}" style="display: none; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--bg-secondary); font-size: 0.75em; color: var(--text-secondary);">
                                        <div style="font-weight: 600; margin-bottom: 4px;">Competitors:</div>
                                        ${competitorNames}
                                    </div>
                                </div>
                            `;
                        });
                        html += `
                                </div>
                            </div>
                        `;
                    }
                });
            }

            html += `
                            </div>
                        </div>

                        <!-- Top 5 Largest Heats -->
                        <div>
                            <div style="font-size: 0.9em; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-secondary); margin-bottom: 16px; font-weight: 600; cursor: pointer; user-select: none;" onclick="toggleStatsSection(this, 'top-heats')">
                                <span style="display: inline-block; margin-right: 8px; transition: transform 0.2s;">▼</span>🏆 Top 5 Largest Heats
                            </div>
                            <div id="top-heats-content" style="display: flex; flex-direction: column; gap: 8px;">
            `;

            topHeats.forEach((h, idx) => {
                const heatsId = `top-heat-${idx}`;
                const heatCompetitors = h.competitors;
                html += `
                    <div style="padding: 10px 12px; background: var(--bg-secondary); border-radius: 4px; border-left: 3px solid var(--accent); cursor: pointer;" onclick="toggleHeatsDetail(this, '${heatsId}')">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;">
                            <div style="flex: 1;">
                                <div style="display: flex; align-items: center; gap: 6px;">
                                    <span style="display: inline-block; transform: rotate(-90deg); transition: transform 0.2s;">▼</span>
                                    <div>
                                        <div style="font-weight: 500; color: var(--text-primary); font-size: 0.95em;">${h.name}</div>
                                        <div style="font-size: 0.75em; color: var(--text-secondary); margin-top: 2px;">${heatCompetitors} competitor${heatCompetitors !== 1 ? 's' : ''}</div>
                                    </div>
                                </div>
                            </div>
                            <div style="font-size: 0.8em; font-weight: 600; color: var(--accent); white-space: nowrap;">#${idx + 1}</div>
                        </div>
                        <div id="${heatsId}" style="display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--bg-tertiary); max-height: 300px; overflow-y: auto;">
                            <div style="font-size: 0.75em; color: var(--text-secondary); margin-bottom: 8px;">
                                Showing ${heatCompetitors} competitor${heatCompetitors !== 1 ? 's' : ''}
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `
                            </div>
                        </div>
                    </div>
                </div>
            `;
            return html;
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            displayParticipants();
            closeDetailView(); // Close overlay when clearing search
            displayRecentlyViewed();
            document.getElementById('contentDisplay').innerHTML = getHomeStats();
        }

        // Toggle event details (expand/collapse)
        function toggleEvent(element) {
            event.stopPropagation(); // Prevent event bubbling
            element.classList.toggle('collapsed');

            const metaDiv = element.querySelector('.event-meta');
            const detailsDiv = element.querySelector('.event-details');

            const isNowCollapsed = element.classList.contains('collapsed');
            if (metaDiv) metaDiv.style.display = isNowCollapsed ? 'none' : 'grid';
            if (detailsDiv) detailsDiv.style.display = isNowCollapsed ? 'none' : 'block';

            // Track expand/collapse
            const eventTitle = element.querySelector('.event-title span span:nth-child(2)')?.textContent || 'Unknown';
            if (isNowCollapsed) {
                trackSectionCollapsed(eventTitle.trim());
            } else {
                trackSectionExpanded(eventTitle.trim());
            }
        }

        // Close overlay when resizing above mobile breakpoint
        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                const overlay = document.querySelector('.detail-overlay');
                if (overlay) {
                    overlay.classList.remove('active');
                }
            }
        });

        // Load data on page load
        loadData();
    </script>
</body>
</html>
