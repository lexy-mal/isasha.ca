<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperial Cup 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #252525;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #00d9ff;
            --accent-dim: #0099cc;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            padding: 60px 0 40px 0;
            border-bottom: 1px solid var(--bg-tertiary);
            margin-bottom: 40px;
            text-align: center;
        }

        h1 {
            font-size: 3.5em;
            font-weight: 200;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent), #00a8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.1em;
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .stats-mini {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        .stats-mini span {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .stats-mini strong {
            color: var(--accent);
        }

        .search-section {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--bg-tertiary);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 1em;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-tertiary);
            box-shadow: 0 0 0 2px rgba(0, 217, 255, 0.1);
        }

        button {
            padding: 14px 24px;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            color: var(--bg-primary);
            font-weight: 600;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        button:hover {
            background: var(--accent-dim);
            transform: translateY(-2px);
        }

        .main-content {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
        }

        .sidebar {
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .sidebar-header {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-weight: 600;
        }

        .results-count {
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-bottom: 12px;
            padding: 8px 0;
            border-bottom: 1px solid var(--bg-tertiary);
        }

        .participant-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .participant-item {
            padding: 12px;
            background: var(--bg-secondary);
            border-left: 2px solid transparent;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
            font-size: 0.95em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .participant-item:hover {
            background: var(--bg-tertiary);
            border-left-color: var(--accent);
        }

        .participant-item.active {
            background: var(--bg-tertiary);
            border-left-color: var(--accent);
            color: var(--accent);
        }

        .participant-count {
            font-size: 0.75em;
            color: var(--text-secondary);
        }

        .content-area {
            min-height: 600px;
        }

        .person-header {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--bg-tertiary);
        }

        .person-name {
            font-size: 2.5em;
            font-weight: 300;
            letter-spacing: -0.01em;
            margin-bottom: 24px;
            background: linear-gradient(135deg, var(--accent), #00a8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .stat-box {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 6px;
            border: 1px solid var(--bg-tertiary);
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 300;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
        }

        .events-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .event-item {
            background: var(--bg-secondary);
            border: 1px solid var(--bg-tertiary);
            border-radius: 6px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .event-item:hover {
            border-color: var(--accent);
            background: var(--bg-tertiary);
        }

        .event-item.collapsed {
            padding: 16px;
        }

        .event-item.collapsed .event-meta,
        .event-item.collapsed .event-details {
            display: none;
        }

        .event-item.collapsed .event-title {
            margin-bottom: 0;
        }

        .event-toggle {
            cursor: pointer;
            font-size: 1.2em;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .event-item.collapsed .event-toggle {
            transform: rotate(-90deg);
        }

        .event-details {
            margin-top: 16px;
        }

        .partner-section {
            background: var(--bg-primary);
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            border-left: 3px solid var(--accent);
        }

        .partner-label {
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .partner-name {
            font-size: 1.1em;
            font-weight: 600;
            color: var(--accent);
        }

        .couples-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .couple-pair {
            background: var(--bg-primary);
            padding: 10px 12px;
            border-radius: 4px;
            border-left: 2px solid var(--accent);
            flex: 0 1 auto;
        }

        .couple-separator {
            color: var(--text-secondary);
            margin: 0 4px;
        }

        .couple-name {
            color: var(--accent);
            cursor: pointer;
            text-decoration: none;
            transition: color 0.2s;
        }

        .couple-name:hover {
            color: var(--text-primary);
        }

        .event-title {
            font-size: 1.1em;
            font-weight: 500;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 12px;
        }

        .heat-label {
            background: var(--accent);
            color: var(--bg-primary);
            padding: 4px 12px;
            border-radius: 3px;
            font-size: 0.8em;
            font-weight: 600;
            white-space: nowrap;
        }

        .event-meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 20px;
            padding: 16px 0;
            border-top: 1px solid var(--bg-tertiary);
            border-bottom: 1px solid var(--bg-tertiary);
        }

        .meta-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .meta-label {
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
        }

        .meta-value {
            font-size: 0.95em;
            color: var(--text-primary);
        }

        .competitors-title {
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .competitors-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .competitor {
            padding: 10px 12px;
            background: var(--bg-primary);
            border-left: 2px solid var(--accent);
            border-radius: 3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95em;
        }

        .competitor-name {
            color: var(--accent);
            cursor: pointer;
            text-decoration: none;
            transition: color 0.2s;
        }

        .competitor-name:hover {
            color: var(--text-primary);
        }

        .role-badge {
            font-size: 0.7em;
            padding: 3px 8px;
            border-radius: 2px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-partner {
            background: rgba(0, 217, 255, 0.2);
            color: var(--accent);
        }

        .badge-opponent {
            background: rgba(160, 160, 160, 0.2);
            color: var(--text-secondary);
        }

        .solo-badge {
            background: rgba(0, 217, 255, 0.1);
            border-left-color: transparent;
            color: var(--text-secondary);
            padding: 12px;
            border-radius: 3px;
            font-size: 0.9em;
        }

        #all-competitors {
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.05), rgba(0, 168, 255, 0.05)) !important;
            border: 1px solid var(--accent-dim) !important;
        }

        #all-competitors .event-title {
            color: var(--accent);
            font-weight: 600;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .no-results-icon {
            font-size: 3em;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* Detail overlay styles - base (hidden on desktop) */
        .detail-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            z-index: 1000;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .detail-overlay.active {
            display: flex;
            opacity: 1;
        }

        .detail-header,
        .detail-back-btn,
        .detail-header-info,
        .detail-person-name,
        .detail-event-count,
        .detail-content {
            display: none; /* Hidden until mobile media query shows them */
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .event-meta {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 2.5em;
            }

            /* Mobile detail overlay styles */
            .detail-header {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 16px;
                background: var(--bg-secondary);
                border-bottom: 1px solid var(--bg-tertiary);
                position: sticky;
                top: 0;
                z-index: 1001;
                flex-shrink: 0;
            }

            .detail-back-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 36px;
                height: 36px;
                background: transparent;
                border: none;
                color: var(--accent);
                font-size: 20px;
                cursor: pointer;
                transition: opacity 0.2s ease;
                flex-shrink: 0;
            }

            .detail-back-btn:active {
                opacity: 0.7;
            }

            .detail-header-info {
                display: flex;
                flex-direction: column;
                gap: 2px;
                flex: 1;
                min-width: 0;
            }

            .detail-person-name {
                display: block;
                font-size: 1em;
                font-weight: 600;
                color: var(--accent);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .detail-event-count {
                display: block;
                font-size: 0.75em;
                color: var(--text-secondary);
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }

            .detail-content {
                display: block;
                flex: 1;
                overflow-y: auto;
                padding: 20px;
                -webkit-overflow-scrolling: touch;
            }

            /* Hide main-content when overlay is active */
            .detail-overlay.active ~ .main-content {
                display: none;
            }

            /* Overlay animations */
            @keyframes slideDown {
                from {
                    opacity: 0;
                    transform: translateY(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }

            .detail-overlay.active .detail-header {
                animation: slideDown 0.3s ease;
            }

            .detail-overlay.active .detail-content {
                animation: fadeIn 0.3s ease 0.1s both;
            }
        }

        @media (max-width: 640px) {
            .container {
                padding: 16px;
            }
            header {
                padding: 40px 0 30px 0;
                margin-bottom: 30px;
            }
            h1 {
                font-size: 2em;
            }
            .stats-mini {
                gap: 20px;
                font-size: 0.8em;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }

        .detail-next-heat {
            display: none;
            font-size: 0.9em;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 4px;
            font-weight: 500;
        }

        @media (max-width: 1024px) {
            .detail-next-heat {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="subtitle">Imperial Cup 2026</div>
            <h1>Event Competitors</h1>
            <div class="stats-mini">
                <span><strong id="totalParticipants">-</strong> Participants</span>
                <span><strong id="totalEvents">-</strong> Events</span>
                <span><strong id="totalHeats">-</strong> Heats</span>
            </div>
        </header>

        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Search participants...">
            <button onclick="clearSearch()">Clear</button>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <div class="sidebar-header">Recently Viewed</div>
                <div id="recentlyViewedContainer" style="margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--bg-tertiary);"></div>

                <div class="sidebar-header">Participants</div>
                <div class="results-count" id="resultsCount"></div>
                <ul class="participant-list" id="participantList"></ul>
            </div>

            <div class="content-area">
                <div id="contentDisplay">
                    <div class="loading">Loading data...</div>
                </div>
            </div>
        </div>

        <div class="detail-overlay">
            <div class="detail-header">
                <button class="detail-back-btn" onclick="closeDetailView()">←</button>
                <div class="detail-header-info">
                    <div class="detail-person-name" id="detailPersonName"></div>
                    <div class="detail-event-count" id="detailEventCount"></div>
                </div>
            </div>
            <div class="detail-content" id="detailContentDisplay">
                <div class="loading">Loading data...</div>
            </div>
        </div>
    </div>

    <script>
        let participantsData = {};
        let heatEventsData = [];
        let sortedParticipants = [];

        // Format names from "Last, First" to "First Last"
        function formatName(name) {
            if (!name || !name.includes(',')) return name;
            const [last, first] = name.split(',').map(n => n.trim());
            return `${first} ${last}`;
        }

        // Parse heat time from format: "03:38PM Sunday" or "06:54PM Sunday Later rounds: 5@07:07PM Sunday"
        function parseHeatTime(timeString) {
            if (!timeString) return null;

            // Match first occurrence of HH:MMAM/PM DayName
            const match = timeString.match(/(\d{1,2}):(\d{2})(AM|PM)\s+(\w+)/);
            if (!match) return null;

            return {
                hour: parseInt(match[1]),
                minute: parseInt(match[2]),
                meridiem: match[3],
                dayName: match[4]
            };
        }

        // Calculate next occurrence of a day/time combination
        function calculateNextOccurrence(parsedTime) {
            if (!parsedTime) return null;

            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const targetDayIndex = days.indexOf(parsedTime.dayName);

            if (targetDayIndex === -1) return null;

            const now = new Date();
            const todayIndex = now.getDay();

            // Convert to 24-hour format
            let hour = parsedTime.hour;
            if (parsedTime.meridiem === 'PM' && hour !== 12) {
                hour += 12;
            } else if (parsedTime.meridiem === 'AM' && hour === 12) {
                hour = 0;
            }

            // Create date for target day/time
            const result = new Date(now);
            result.setHours(hour, parsedTime.minute, 0, 0);

            // Calculate days to add
            let daysToAdd = targetDayIndex - todayIndex;
            if (daysToAdd < 0 || (daysToAdd === 0 && result <= now)) {
                daysToAdd += 7;
            }

            result.setDate(result.getDate() + daysToAdd);
            return result;
        }

        // Get next upcoming heat for a person
        function getNextHeatForPerson(personData) {
            if (!personData || !personData.entries || personData.entries.length === 0) {
                return null;
            }

            const now = new Date();
            const upcomingHeats = [];

            // Calculate next occurrence for each entry
            personData.entries.forEach(entry => {
                const parsed = parseHeatTime(entry.time);
                if (parsed) {
                    const nextTime = calculateNextOccurrence(parsed);
                    if (nextTime && nextTime > now) {
                        upcomingHeats.push({
                            heat: entry.heat,
                            time: nextTime,
                            originalTime: entry.time
                        });
                    }
                }
            });

            // Return earliest upcoming heat
            if (upcomingHeats.length === 0) {
                return null;
            }

            return upcomingHeats.sort((a, b) => a.time - b.time)[0];
        }

        // Format countdown display text
        function formatCountdownTime(nextHeatTime) {
            if (!nextHeatTime) {
                return '✓ All events completed';
            }

            const now = new Date();
            const diffMs = nextHeatTime.time - now;
            const diffMins = Math.ceil(diffMs / 60000);

            if (diffMins < 1) {
                // Less than 1 minute - heat is starting now
                const heatNum = nextHeatTime.heat || '';
                return `🕐 Next: ${heatNum} starting now!`;
            } else if (diffMins === 1) {
                const heatNum = nextHeatTime.heat || '';
                return `🕐 Next: ${heatNum} in <1 min`;
            } else {
                const heatNum = nextHeatTime.heat || '';
                return `🕐 Next: ${heatNum} in ${diffMins} mins`;
            }
        }

        // Update countdown display in detail header
        function updateDetailCountdown() {
            const currentName = document.getElementById('detailPersonName')?.textContent;
            if (!currentName || !participantsData[currentName]) {
                return;
            }

            const nextHeat = getNextHeatForPerson(participantsData[currentName]);
            const countdownText = nextHeat
                ? formatCountdownTime(nextHeat)
                : '✓ All events completed';

            let countdownElement = document.getElementById('detailNextHeat');
            if (!countdownElement) {
                // Create element if it doesn't exist
                const headerInfo = document.querySelector('.detail-header-info');
                if (headerInfo) {
                    countdownElement = document.createElement('div');
                    countdownElement.id = 'detailNextHeat';
                    countdownElement.className = 'detail-next-heat';
                    headerInfo.appendChild(countdownElement);
                }
            }

            if (countdownElement) {
                countdownElement.textContent = countdownText;
            }
        }

        // Google Analytics Event Tracking
        function trackEvent(eventName, eventData = {}) {
          if (typeof gtag !== 'undefined') {
            gtag('event', eventName, {
              'page_title': document.title,
              ...eventData
            });
          }
        }

        function trackSearch(searchTerm, resultsCount) {
          trackEvent('search', {
            'search_term': searchTerm,
            'results_count': resultsCount
          });
        }

        function trackCompetitorViewed(competitorName, entryCount) {
          trackEvent('competitor_viewed', {
            'competitor_name': competitorName,
            'entry_count': entryCount,
            'view_source': 'search_or_click'
          });
        }

        function trackSectionExpanded(sectionName) {
          trackEvent('section_expanded', {
            'section_name': sectionName
          });
        }

        function trackSectionCollapsed(sectionName) {
          trackEvent('section_collapsed', {
            'section_name': sectionName
          });
        }

        function trackRecentlyViewedClick(competitorName) {
          trackEvent('recently_viewed_click', {
            'competitor_name': competitorName
          });
        }

        // Load data from JSON files
        async function loadData() {
            try {
                const [participantsRes, heatEventsRes] = await Promise.all([
                    fetch('dance_assets/participants.json'),
                    fetch('dance_assets/heat_events.json')
                ]);

                participantsData = await participantsRes.json();
                heatEventsData = await heatEventsRes.json();
                sortedParticipants = Object.keys(participantsData).sort();

                // Update dynamic stats
                document.getElementById('totalParticipants').textContent = sortedParticipants.length;
                document.getElementById('totalEvents').textContent = heatEventsData.length;
                const uniqueHeats = new Set(heatEventsData.map(e => e.heat)).size;
                document.getElementById('totalHeats').textContent = uniqueHeats;

                displayRecentlyViewed();
                displayParticipants();

                // Initialize countdown timer - updates every 60 seconds
                setInterval(updateDetailCountdown, 60000);
                // Call immediately on first load
                updateDetailCountdown();
            } catch (error) {
                document.getElementById('contentDisplay').innerHTML =
                    `<div class="no-results"><div>Error loading data: ${error.message}</div></div>`;
                console.error('Data loading error:', error);
            }
        }

        function displayParticipants(filter = '') {
            const list = document.getElementById('participantList');
            list.innerHTML = '';

            const filtered = sortedParticipants.filter(name =>
                name.toLowerCase().includes(filter.toLowerCase())
            );

            // Track search events
            if (filter.trim().length > 0) {
                trackSearch(filter, filtered.length);
            }

            document.getElementById('resultsCount').textContent =
                `${filtered.length} / ${sortedParticipants.length}`;

            filtered.forEach(name => {
                const entryCount = participantsData[name].entries.length;
                const item = document.createElement('li');
                item.className = 'participant-item';
                item.innerHTML = `
                    <span>${name}</span>
                    <span class="participant-count">${entryCount}</span>
                `;
                item.onclick = () => selectParticipant(name, item);
                list.appendChild(item);
            });
        }

        function addToRecentlyViewed(name) {
            let recentlyViewed = JSON.parse(localStorage.getItem('danceRecentlyViewed') || '[]');

            // Remove if already exists
            recentlyViewed = recentlyViewed.filter(n => n !== name);

            // Add to front
            recentlyViewed.unshift(name);

            // Keep only last 10
            recentlyViewed = recentlyViewed.slice(0, 10);

            localStorage.setItem('danceRecentlyViewed', JSON.stringify(recentlyViewed));
            displayRecentlyViewed();
        }

        function displayRecentlyViewed() {
            const recentlyViewed = JSON.parse(localStorage.getItem('danceRecentlyViewed') || '[]');
            const container = document.getElementById('recentlyViewedContainer');

            if (recentlyViewed.length === 0) {
                container.innerHTML = '<div style="font-size: 0.9em; color: var(--text-secondary); padding: 8px 0;">None yet</div>';
                return;
            }

            let html = '<ul style="list-style: none; display: flex; flex-direction: column; gap: 4px;">';
            recentlyViewed.forEach(name => {
                const entryCount = participantsData[name]?.entries.length || 0;
                html += `
                    <li class="participant-item" style="padding: 8px; cursor: pointer;" onclick="trackRecentlyViewedClick('${name}'); searchAndSelect('${name}')">
                        <span>${name}</span>
                        <span class="participant-count">${entryCount}</span>
                    </li>
                `;
            });
            html += '</ul>';
            container.innerHTML = html;
        }

        function selectParticipant(name, element) {
            document.querySelectorAll('.participant-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            // Track competitor view
            const entryCount = participantsData[name]?.entries.length || 0;
            trackCompetitorViewed(name, entryCount);

            // Add to recently viewed
            addToRecentlyViewed(name);

            // Update countdown timer immediately
            updateDetailCountdown();

            // Show overlay on mobile
            const overlay = document.querySelector('.detail-overlay');
            if (window.innerWidth <= 768) {
                overlay.classList.add('active');
            }

            // Update header text
            document.getElementById('detailPersonName').textContent = name;

            // Calculate completed vs upcoming events
            const now = new Date();
            let completedCount = 0;
            const data = participantsData[name];

            if (data && data.entries) {
                data.entries.forEach(entry => {
                    const parsed = parseHeatTime(entry.time);
                    if (parsed) {
                        const nextTime = calculateNextOccurrence(parsed);
                        if (nextTime && nextTime <= now) {
                            completedCount++;
                        }
                    }
                });
            }

            const upcomingCount = entryCount - completedCount;
            document.getElementById('detailEventCount').textContent = `${entryCount} event${entryCount !== 1 ? 's' : ''} (${completedCount} completed, ${upcomingCount} left)`;

            displayPersonDetails(name);
        }

        function displayPersonDetails(name) {
            const data = participantsData[name];
            const overlay = document.querySelector('.detail-overlay');
            const contentElement = (overlay && overlay.classList.contains('active')) ?
                document.getElementById('detailContentDisplay') :
                document.getElementById('contentDisplay');

            if (!data || data.entries.length === 0) {
                contentElement.innerHTML = `<div class="no-results"><div>No events</div></div>`;
                return;
            }

            const partners = new Set(data.entries.map(e => e.partner).filter(p => p));
            const soloCount = data.entries.filter(e => !e.partner).length;
            const allEventCompetitors = new Set();

            data.entries.forEach(entry => {
                const eventInfo = heatEventsData.find(he => he.heat === entry.heat && he.event === entry.event);
                if (eventInfo) {
                    eventInfo.competitors.forEach(c => {
                        if (c !== name) allEventCompetitors.add(c);
                    });
                }
            });

            let html = `
                <div class="person-header">
                    <div class="person-name">${name}</div>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-value">${data.entries.length}</div>
                            <div class="stat-label">Events</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${partners.size}</div>
                            <div class="stat-label">Partners</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${soloCount}</div>
                            <div class="stat-label">Solo</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${allEventCompetitors.size}</div>
                            <div class="stat-label">Competitors</div>
                        </div>
                    </div>
                </div>
            `;

            // Build all competitors section FIRST (appears at top)
            // Separate partners from general competitors
            const partnerSet = partners; // partners already identified above
            const allCompetitors = {};
            const partnerCompetitors = {};

            data.entries.forEach(entry => {
                const eventInfo = heatEventsData.find(he => he.heat === entry.heat && he.event === entry.event);
                if (eventInfo) {
                    eventInfo.competitors.forEach(competitor => {
                        if (competitor !== name) {
                            const isPartner = partnerSet.has(competitor);
                            const targetObj = isPartner ? partnerCompetitors : allCompetitors;

                            if (!targetObj[competitor]) {
                                targetObj[competitor] = [];
                            }
                            targetObj[competitor].push({
                                event: entry.event,
                                time: entry.time,
                                heat: entry.heat,
                                competitors: eventInfo.competitors.length
                            });
                        }
                    });
                }
            });

            const totalCompetitors = Object.keys(allCompetitors).length + Object.keys(partnerCompetitors).length;

            if (totalCompetitors > 0) {
                html += `
                    <div class="event-item collapsed" id="all-competitors" onclick="toggleEvent(this)">
                        <div class="event-title">
                            <span style="flex: 1;">
                                <span class="event-toggle">▶</span>
                                All Competitors
                            </span>
                            <span class="heat-label">${totalCompetitors}</span>
                        </div>
                        <div class="event-summary" style="font-size: 0.9em; color: var(--text-secondary); margin-top: 8px;">
                            ${[...Object.keys(partnerCompetitors), ...Object.keys(allCompetitors)].sort().map(formatName).join(', ')}
                        </div>
                        <div class="event-meta" style="display: none;">
                            <div class="meta-field">
                                <div class="meta-label">Unique Competitors</div>
                                <div class="meta-value">${totalCompetitors} total</div>
                            </div>
                        </div>
                        <div class="event-details" style="display: none;">
`;

                // Show partners first
                if (Object.keys(partnerCompetitors).length > 0) {
                    html += `
                        <div style="margin-bottom: 24px;">
                            <div style="font-weight: 600; color: var(--accent); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--accent-dim);">
                                💃 Partners
                            </div>
`;
                    Object.keys(partnerCompetitors).sort().forEach(partner => {
                        const events = partnerCompetitors[partner];
                        html += `
                            <div style="margin-bottom: 16px;">
                                <div class="competitor-name" onclick="searchAndSelect('${partner}')" style="cursor: pointer; color: var(--accent); margin-bottom: 8px;">
                                    ${partner}
                                </div>
`;
                        const uniqueEvents = {};
                        events.forEach(evt => {
                            if (!uniqueEvents[evt.event]) {
                                uniqueEvents[evt.event] = evt;
                            }
                        });

                        Object.values(uniqueEvents).forEach(evt => {
                            html += `
                                <div style="margin-left: 12px; margin-bottom: 8px; padding: 10px; background: var(--bg-primary); border-left: 3px solid var(--accent); border-radius: 3px; font-size: 0.9em;">
                                    <div style="color: var(--text-primary); margin-bottom: 4px;">${evt.event}</div>
                                    <div style="color: var(--text-secondary); font-size: 0.85em; display: flex; gap: 12px;">
                                        <span>🕐 ${evt.time}</span>
                                        <span>👥 ${evt.competitors} participant${evt.competitors !== 1 ? 's' : ''}</span>
                                    </div>
                                </div>
`;
                        });
                        html += `</div>`;
                    });
                    html += `</div>`;
                }

                // Show other competitors
                if (Object.keys(allCompetitors).length > 0) {
                    html += `
                        <div>
                            <div style="font-weight: 600; color: var(--text-primary); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--bg-tertiary);">
                                👥 Other Competitors
                            </div>
`;
                    Object.keys(allCompetitors).sort().forEach(competitor => {
                        const events = allCompetitors[competitor];
                        html += `
                            <div style="margin-bottom: 16px;">
                                <div class="competitor-name" onclick="searchAndSelect('${competitor}')" style="cursor: pointer; color: var(--accent); margin-bottom: 8px;">
                                    ${competitor}
                                </div>
`;
                        const uniqueEvents = {};
                        events.forEach(evt => {
                            if (!uniqueEvents[evt.event]) {
                                uniqueEvents[evt.event] = evt;
                            }
                        });

                        Object.values(uniqueEvents).forEach(evt => {
                            html += `
                                <div style="margin-left: 12px; margin-bottom: 8px; padding: 10px; background: var(--bg-primary); border-left: 2px solid var(--accent); border-radius: 3px; font-size: 0.9em;">
                                    <div style="color: var(--text-primary); margin-bottom: 4px;">${evt.event}</div>
                                    <div style="color: var(--text-secondary); font-size: 0.85em; display: flex; gap: 12px;">
                                        <span>🕐 ${evt.time}</span>
                                        <span>👥 ${evt.competitors} participant${evt.competitors !== 1 ? 's' : ''}</span>
                                    </div>
                                </div>
`;
                        });
                        html += `</div>`;
                    });
                    html += `</div>`;
                }

                html += `
                        </div>
                    </div>
                `;
            }

            html += `<div class="events-list">
            `;

            const byHeatEvent = {};
            data.entries.forEach(entry => {
                const key = entry.heat + '|' + entry.event;
                if (!byHeatEvent[key]) {
                    byHeatEvent[key] = {
                        heat: entry.heat,
                        event: entry.event,
                        time: entry.time,
                        session: entry.session,
                        entries: []
                    };
                }
                byHeatEvent[key].entries.push(entry);
            });

            Object.keys(byHeatEvent).sort().forEach(key => {
                const info = byHeatEvent[key];
                const eventInfo = heatEventsData.find(he => he.heat === info.heat && he.event === info.event);

                if (!eventInfo) return;

                const competitors = eventInfo.competitors || [];
                const partner = info.entries[0]?.partner;
                const isCoupleEvent = !!partner; // If person has a partner in this event, it's a couple event
                const eventId = `event-${info.heat.replace(/\s+/g, '-')}-${info.event.replace(/\s+/g, '-')}`;

                html += `<div class="event-item collapsed" id="${eventId}" onclick="toggleEvent(this)">`;
                html += `
                    <div class="event-title">
                        <span style="flex: 1;">
                            <span class="event-toggle">▶</span>
                            ${info.event}
                        </span>
                        <span class="heat-label">${info.heat}</span>
                    </div>
                `;

                // Collapsed view (always shown)
                const coupleCount = isCoupleEvent ? Math.ceil(competitors.length / 2) : null;
                const countText = isCoupleEvent
                    ? `${coupleCount} couple${coupleCount !== 1 ? 's' : ''}`
                    : `${competitors.length} competitor${competitors.length !== 1 ? 's' : ''}`;

                html += `
                    <div class="event-summary" style="font-size: 0.9em; color: var(--text-secondary); margin-top: 8px;">
                        ${partner ? `<strong style="color: var(--accent);">${partner}</strong> | ` : ''}${info.time} | ${countText}
                    </div>
                `;

                // Expanded view (hidden by default)
                html += `<div class="event-meta" style="display: none;">`;
                html += `
                    <div class="meta-field">
                        <div class="meta-label">Time</div>
                        <div class="meta-value">${info.time}</div>
                    </div>
                    <div class="meta-field">
                        <div class="meta-label">Competitors</div>
                        <div class="meta-value">${competitors.length} total</div>
                    </div>
                `;
                html += `</div>`;

                html += `<div class="event-details" style="display: none;">`;

                if (competitors.length === 1) {
                    html += `<div class="solo-badge">✓ Solo performance</div>`;
                } else if (isCoupleEvent && partner) {
                    // Couple event with partner
                    html += `
                        <div class="partner-section">
                            <div class="partner-label">Dancing with</div>
                            <div class="partner-name">${partner}</div>
                        </div>
                    `;

                    // Show other competitors as couples (excluding self and partner)
                    const otherCompetitors = competitors.filter(c => c !== name && c !== partner);

                    if (otherCompetitors.length > 0) {
                        html += `<div class="competitors-title">Other Competitors</div>`;
                        html += `<div class="couples-grid">`;

                        // Group competitors into couples by checking their partner info
                        const processedCompetitors = new Set();

                        otherCompetitors.forEach(competitor => {
                            if (processedCompetitors.has(competitor)) return;

                            // Find this competitor's partner in this heat
                            const competitorData = participantsData[competitor];
                            let competitorPartner = null;

                            if (competitorData) {
                                const competitorEntry = competitorData.entries.find(
                                    e => e.heat === info.heat && e.event === info.event
                                );
                                competitorPartner = competitorEntry?.partner;
                            }

                            // If they have a partner in this heat and that partner is also a competitor
                            if (competitorPartner && otherCompetitors.includes(competitorPartner)) {
                                html += `<div class="couple-pair">`;
                                html += `<span class="couple-name" onclick="searchAndSelect('${competitor}')">${competitor}</span>`;
                                html += `<span class="couple-separator"> & </span>`;
                                html += `<span class="couple-name" onclick="searchAndSelect('${competitorPartner}')">${competitorPartner}</span>`;
                                html += `</div>`;

                                processedCompetitors.add(competitor);
                                processedCompetitors.add(competitorPartner);
                            } else {
                                // Solo in couple event
                                html += `<div class="couple-pair">`;
                                html += `<span class="couple-name" onclick="searchAndSelect('${competitor}')">${competitor}</span>`;
                                html += `</div>`;
                                processedCompetitors.add(competitor);
                            }
                        });

                        html += `</div>`;
                    }
                } else {
                    // Solo event or non-couple event
                    html += `<div class="competitors-title">👥 ${competitors.length > 1 ? 'Competing with' : 'Solo event'}</div>`;
                    html += `<div class="competitors-list">`;

                    if (competitors.length === 1) {
                        html += `<div class="solo-badge">✓ Solo performance</div>`;
                    } else {
                        competitors.forEach(competitor => {
                            if (competitor !== name) {
                                const isPartner = info.entries.some(e => e.partner === competitor);
                                const badgeClass = isPartner ? 'badge-partner' : 'badge-opponent';
                                const roleText = isPartner ? 'Partner' : 'Opponent';

                                html += `
                                    <div class="competitor">
                                        <span class="competitor-name" onclick="searchAndSelect('${competitor}')">${competitor}</span>
                                        <span class="role-badge ${badgeClass}">${roleText}</span>
                                    </div>
                                `;
                            }
                        });
                    }

                    html += `</div>`;
                }

                html += `</div>`;
                html += `</div>`;
            });

            html += '</div>';
            contentElement.innerHTML = html;
        }

        function searchAndSelect(name) {
            document.getElementById('searchInput').value = name;
            displayParticipants(name);
            setTimeout(() => {
                const items = Array.from(document.querySelectorAll('.participant-item'));
                const item = items.find(el => {
                    // Get the span text (first child)
                    const span = el.querySelector('span');
                    return span && span.textContent.trim() === name;
                });
                if (item) selectParticipant(name, item);
            }, 100);
        }

        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            displayParticipants(e.target.value);
        });

        function closeDetailView() {
            const overlay = document.querySelector('.detail-overlay');
            overlay.classList.remove('active');
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            displayParticipants();
            closeDetailView(); // Close overlay when clearing search
            displayRecentlyViewed();
            document.getElementById('contentDisplay').innerHTML =
                '<div class="no-results"><div class="no-results-icon">→</div><div>Select a participant</div></div>';
        }

        // Toggle event details (expand/collapse)
        function toggleEvent(element) {
            event.stopPropagation(); // Prevent event bubbling
            element.classList.toggle('collapsed');

            const metaDiv = element.querySelector('.event-meta');
            const detailsDiv = element.querySelector('.event-details');

            const isNowCollapsed = element.classList.contains('collapsed');
            if (metaDiv) metaDiv.style.display = isNowCollapsed ? 'none' : 'grid';
            if (detailsDiv) detailsDiv.style.display = isNowCollapsed ? 'none' : 'block';

            // Track expand/collapse
            const eventTitle = element.querySelector('.event-title span span:nth-child(2)')?.textContent || 'Unknown';
            if (isNowCollapsed) {
                trackSectionCollapsed(eventTitle.trim());
            } else {
                trackSectionExpanded(eventTitle.trim());
            }
        }

        // Close overlay when resizing above mobile breakpoint
        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                const overlay = document.querySelector('.detail-overlay');
                if (overlay) {
                    overlay.classList.remove('active');
                }
            }
        });

        // Load data on page load
        loadData();
    </script>
</body>
</html>
